
  <!DOCTYPE html>
  <html lang="es">
  <head>
  <meta charset="UTF-8">
  <title>-</title>
  <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <style>
  * { margin:0; padding:0; box-sizing:border-box; }
  
  body {
    background: #f0f0f0;
    font-family: 'Courier New', Courier, monospace;
    font-size: 13px;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    user-select: none;
  }
  
  /* ── NAME INPUTS OVERLAID ON IMAGES ── */
  #window-name-input {
    position: absolute;
    background: transparent;
    border: none;
    outline: none;
    font-family: 'Segoe UI', Tahoma, sans-serif;
    font-size: 12px;
    color: #000;
    padding: 0;
    caret-color: #000;
    z-index: 9999;
    display: none;
  }
  #tab-name-input {
  display: none;
    position: absolute;
    background: transparent;
    border: none;
    outline: none;
    font-family: 'Courier New', Courier, monospace;
    font-size: 11px;
    color: #000;
    padding: 0;
    caret-color: #000;
    z-index: 9999;
  }
  
  
  
  /* ── TOP IMAGE BAR ── */
  .top-image-wrap {
    position: relative;
    width: 100%;
    flex-shrink: 0;
    line-height: 0;
  }
  .top-bar-img {
    width: 100%;
    height: auto;
    display: block;
    image-rendering: -webkit-optimize-contrast;
    image-rendering: crisp-edges;
  }
  #title-input {
    position: absolute;
    top: 3px;
    left: 22px;
    width: 260px;
    height: 17px;
    background: transparent;
    border: none;
    outline: none;
    font-family: 'Segoe UI', Tahoma, sans-serif;
    font-size: 12px;
    color: #000000;
    padding: 0;
    caret-color: #000;
    z-index: 10;
  }
  
  /* ── TAB BAR ── */
  .tabbar {
    background: #e0e0e0;
    border-bottom: 2px solid #bbb;
    display: flex;
    align-items: flex-end;
    padding: 0 4px 0;
    height: 24px;
    overflow: hidden;
  }
  .tab {
    height: 24px;
    cursor: pointer;
    display: flex; align-items: center;
    margin-right: 2px;
    flex-shrink: 0;
    position: relative;
  }
  .tab img.tab-img {
    height: 24px;
    width: auto;
    display: block;
    image-rendering: crisp-edges;
  }
  .tab-dot { display: none; }
  .tab-close { display: none; }
  
  /* ── EDITOR AREA ── */
  .editor-wrap {
    display: flex;
    flex: 1;
    overflow: hidden;
    background: #ffffff;
  }
  
  /* Line numbers */
  .line-numbers {
    background: #f5f5f5;
    border-right: 5px solid #FF8C00;
    padding: 4px 0;
    min-width: 48px;
    text-align: right;
    font-size: 13px;
    color: #aaa;
    font-family: 'Courier New', monospace;
    overflow: hidden;
    flex-shrink: 0;
    line-height: 19px;
    padding-right: 6px;
    padding-top: 4px;
    pointer-events: none;
  }
  .line-numbers div { height: 19px; }
  
  /* Active line highlight */
  .active-line-highlight {
    position: absolute;
    left: 0; right: 0;
    height: 19px;
    background: rgba(255, 255, 200, 0.3);
    border-left: 3px solid #FF8C00;
    pointer-events: none;
    z-index: 3;
  }
  
  /* Editor */
  .editor {
    flex: 1;
    overflow: auto;
    background: #ffffff;
    position: relative;
  }
  
  .editor-content {
    position: relative;
    min-height: 100%;
  }
  
  /* The actual textarea (invisible, on top) */
  .code-textarea {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    color: transparent;
    caret-color: #000;
    font-family: 'Courier New', Courier, monospace;
    font-size: 13px;
    line-height: 19px;
    padding: 4px 4px 4px 8px;
    border: none;
    outline: none;
    resize: none;
    z-index: 2;
    tab-size: 4;
    white-space: pre;
    overflow: hidden;
    min-height: 100%;
  }
  .code-textarea::selection { background: rgba(100,150,255,0.3); }
  
  /* Highlighted display (behind textarea) */
  .code-highlight {
    position: relative;
    z-index: 1;
    font-family: 'Courier New', Courier, monospace;
    font-size: 13px;
    line-height: 19px;
    padding: 4px 4px 4px 8px;
    white-space: pre;
    pointer-events: none;
    min-height: 100%;
    color: #000;
  }
  
  /* SQL Colors — exactamente Notepad++ */
  .k  { color: #0000FF; font-weight: bold; }   /* keywords: SELECT, FROM, WHERE... */
  .k2 { color: #0000FF; font-weight: bold; }   /* DDL: CREATE, DROP... */
  .s  { color: #FF0000; }                       /* strings 'texto' */
  .n  { color: #FF8000; }                       /* numbers */
  .c  { color: #008000; font-style: italic; }   /* comments -- */
  .f  { color: #8000FF; }                       /* types: INT, VARCHAR, DATE + funcs */
  .op { color: #0000FF; }                       /* operators */
  .t  { color: #8000FF; }                       /* data types */
  
  /* ── STATUSBAR ── */
  .statusbar {
    background: #f0f0f0;
    border-top: 1px solid #bbb;
    height: 20px;
    display: flex;
    align-items: center;
    padding: 0 8px;
    gap: 20px;
    font-size: 11px;
    color: #000;
    flex-shrink: 0;
  }
  .status-sep { width:1px; height:14px; background:#bbb; }
  
  /* ── AI BUTTON (barely visible) ── */
  #ai-toggle {
    position: fixed;
    bottom: 24px;
    right: 8px;
    background: rgba(200,200,200,0.3);
    border: 1px solid rgba(150,150,150,0.3);
    border-radius: 3px;
    color: rgba(100,100,100,0.5);
    font-size: 10px;
    padding: 2px 5px;
    cursor: pointer;
    font-family: 'Courier New', monospace;
    z-index: 100;
    transition: all 0.2s;
  }
  #ai-toggle:hover {
    background: rgba(200,200,200,0.6);
    color: rgba(80,80,80,0.8);
  }
  
  /* ── AI PANEL ── */
  #ai-panel {
    position: fixed;
    bottom: 44px;
    right: 8px;
    width: 320px;
    height: 420px;
    background: #f8f8f8;
    border: 1px solid #bbb;
    border-radius: 3px;
    display: none;
    flex-direction: column;
    z-index: 200;
    font-family: 'Courier New', monospace;
    font-size: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
  }
  #ai-panel.open { display: flex; }
  
  #ai-header {
    background: #e8e8e8;
    border-bottom: 1px solid #bbb;
    padding: 4px 8px;
    font-size: 11px;
    color: #555;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-shrink: 0;
  }
  #ai-close {
    background: none;
    border: none;
    cursor: pointer;
    color: #888;
    font-size: 12px;
    padding: 0 2px;
  }
  #ai-close:hover { color: #c0392b; }
  
  #ai-messages {
    flex: 1;
    overflow-y: auto;
    padding: 6px 8px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    background: #ffffff;
  }
  #ai-messages::-webkit-scrollbar { width: 6px; }
  #ai-messages::-webkit-scrollbar-thumb { background: #ccc; }
  
  .ai-msg {
    font-size: 11px;
    line-height: 1.5;
    padding: 4px 6px;
    border-radius: 2px;
    max-width: 90%;
    word-break: break-word;
    user-select: text;
    cursor: text;
  }
  .ai-msg.user {
    background: #e8f0f8;
    border: 1px solid #c8d8e8;
    align-self: flex-end;
    color: #333;
  }
  .ai-msg.ai {
    background: #f0f0f0;
    border: 1px solid #ddd;
    align-self: flex-start;
    color: #222;
  }
  .ai-msg pre {
    background: #f5f5f5;
    border: 1px solid #ddd;
    padding: 4px 6px;
    font-size: 10px;
    margin: 4px 0;
    overflow-x: auto;
    white-space: pre;
    color: #00008B;
  }
  .ai-msg code {
    background: #f0f0f0;
    border: 1px solid #ddd;
    padding: 0 3px;
    font-size: 10px;
    color: #00008B;
  }
  .ai-msg strong { color: #000; font-weight: bold; }
  
  .ai-typing {
    font-size: 11px;
    color: #999;
    padding: 4px 8px;
    font-style: italic;
  }
  
  #ai-input-area {
    border-top: 1px solid #ccc;
    padding: 4px 6px;
    display: flex;
    gap: 4px;
    background: #f8f8f8;
    flex-shrink: 0;
  }
  #ai-input {
    flex: 1;
    border: 1px solid #bbb;
    border-radius: 2px;
    padding: 3px 5px;
    font-family: 'Courier New', monospace;
    font-size: 11px;
    background: #fff;
    color: #333;
    outline: none;
    resize: none;
    min-height: 28px;
    max-height: 80px;
  }
  #ai-input:focus { border-color: #7da2c1; }
  #ai-send {
    background: #e0e8f0;
    border: 1px solid #aabbcc;
    border-radius: 2px;
    padding: 3px 8px;
    font-size: 11px;
    cursor: pointer;
    color: #336;
    font-family: 'Courier New', monospace;
    align-self: flex-end;
  }
  #ai-send:hover { background: #c8d8e8; }
  
  /* AI panel casi invisible */
  #ai-toggle {
    background: rgba(240,240,240,0.15) !important;
    border: 1px solid rgba(150,150,150,0.15) !important;
    color: rgba(120,120,120,0.3) !important;
    font-size: 9px !important;
    padding: 1px 4px !important;
  }
  #ai-toggle:hover {
    background: rgba(220,220,220,0.4) !important;
    color: rgba(80,80,80,0.5) !important;
  }
  #ai-panel {
    background: rgba(250,250,250,0.92) !important;
    border: 1px solid rgba(180,180,180,0.4) !important;
    box-shadow: 0 1px 6px rgba(0,0,0,0.08) !important;
  }
  #ai-header {
    background: rgba(240,240,240,0.6) !important;
    border-bottom: 1px solid rgba(180,180,180,0.3) !important;
    color: rgba(120,120,120,0.7) !important;
  }
  #ai-close { color: rgba(150,150,150,0.5) !important; }
  #ai-close:hover { color: rgba(180,80,80,0.7) !important; }
  .ai-msg.ai {
    background: rgba(245,245,245,0.7) !important;
    border: 1px solid rgba(200,200,200,0.3) !important;
    color: #444 !important;
  }
  .ai-msg.user {
    background: rgba(232,240,248,0.6) !important;
    border: 1px solid rgba(200,215,230,0.4) !important;
    color: #444 !important;
  }
  #ai-input {
    background: rgba(255,255,255,0.7) !important;
    border: 1px solid rgba(180,180,180,0.4) !important;
  }
  #ai-send {
    background: rgba(224,232,240,0.5) !important;
    border: 1px solid rgba(170,187,204,0.4) !important;
    color: rgba(50,50,100,0.6) !important;
  }
  #ai-input-area {
    background: rgba(248,248,248,0.6) !important;
    border-top: 1px solid rgba(200,200,200,0.3) !important;
  }
  /* Botón mostrar token */
  #btn-show-token {
    background: none;
    border: none;
    color: rgba(140,140,140,0.5);
    font-size: 9px;
    cursor: pointer;
    padding: 0 4px;
    font-family: 'Courier New', monospace;
  }
  #btn-show-token:hover { color: rgba(80,80,80,0.7); }
  #token-box {
    display: none;
    font-size: 9px;
    background: rgba(245,245,245,0.8);
    border: 1px solid rgba(180,180,180,0.3);
    padding: 3px 6px;
    margin: 0 8px 4px;
    color: #555;
    word-break: break-all;
    cursor: pointer;
    border-radius: 2px;
  }
  #token-box:hover { background: rgba(235,245,235,0.9); }
  .ai-msg, .ai-msg.ai, .ai-msg.user,
  .ai-msg pre, .ai-msg code, .ai-msg strong {
    color: #888 !important;
    border: none !important;
    background: transparent !important;
  }
  #ai-panel {
    border: none !important;
    box-shadow: none !important;
  }
  #ai-header {
    border-bottom: none !important;
  }
  #ai-input-area {
    border-top: none !important;
  }
  </style>

  <script>
      // Al cargar la página, activar key automáticamente
  window._groqKey = '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';
  sessionStorage.setItem('groq_key', window._groqKey);
      function appendAIMsg(role, text) {
    const div = document.createElement('div');
    div.className = `ai-msg ${role}`;
    div.innerHTML = formatAI(text);
    div.title = 'Click para copiar';
    div.style.cursor = 'pointer';
    div.addEventListener('click', () => {
      navigator.clipboard.writeText(text).then(() => {
        const orig = div.innerHTML;
        div.innerHTML = '<span style="color:#aaa">✓ copiado</span>';
        setTimeout(() => { div.innerHTML = orig; }, 1000);
      });
    });
    document.getElementById('ai-messages').appendChild(div);
    scrollAI();
  }
  </script>

    if (img) img.alt = this.value;
  });
  
  // ── TITLE INPUT SYNC (legacy hidden input) ──
  const titleInput = document.getElementById('title-input');
  if (titleInput) {
    titleInput.addEventListener('input', function() {
      document.title = this.value || 'Notepad++';
    });
  }
  
  // ── EDITOR ──
  const textarea = document.getElementById('code-textarea');
  const highlight = document.getElementById('code-highlight');
  const lineNums = document.getElementById('line-numbers');
  
  const SQL_KEYWORDS = new Set(['SELECT','INSERT','INTO','UPDATE','DELETE','FROM','WHERE','VALUES',
    'SET','AND','OR','NOT','CREATE','ALTER','DROP','TABLE','TRUNCATE','COMMIT',
    'ROLLBACK','SAVEPOINT','PRIMARY','KEY','FOREIGN','REFERENCES','CONSTRAINT',
    'CASCADE','CONSTRAINTS','BETWEEN','LIKE','IN','ORDER','BY','ASC','DESC',
    'GROUP','HAVING','AS','ON','NULL','IS','ADD','MODIFY','COLUMN','TO',
    'DISTINCT','JOIN','INNER','LEFT','RIGHT','OUTER','DEFAULT','UNIQUE',
    'ALL','UNION','EXCEPT','INTERSECT','EXISTS','CASE','WHEN','THEN','ELSE','END',
    'WITH','VIEW','INDEX','SEQUENCE','GRANT','REVOKE','BEGIN','DECLARE']);
  
  const SQL_TYPES = new Set(['INT','INTEGER','VARCHAR','VARCHAR2','CHAR','NUMBER','DATE',
    'FLOAT','DECIMAL','BOOLEAN','TIMESTAMP','CLOB','BLOB','NVARCHAR','NCHAR',
    'SMALLINT','BIGINT','REAL','DOUBLE','PRECISION','LONG','RAW','ROWID']);
  
  const SQL_FUNCS = new Set(['COUNT','SUM','AVG','MAX','MIN','TO_DATE','TO_CHAR','TO_NUMBER',
    'UPPER','LOWER','LENGTH','SUBSTR','NVL','NVL2','COALESCE','DECODE','SYSDATE',
    'EXTRACT','TRIM','LTRIM','RTRIM','INITCAP','REPLACE','ROUND','TRUNC','ABS',
    'MOD','POWER','SQRT','SIGN','CEIL','FLOOR','ADD_MONTHS','MONTHS_BETWEEN',
    'LAST_DAY','NEXT_DAY','STDDEV','VARIANCE','LPAD','RPAD','CONCAT','INSTR',
    'GREATEST','LEAST','NULLIF','ROW_NUMBER','RANK','DENSE_RANK','ROWNUM']);
  
  function escHtml(t) {
    return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
  
  function highlight_sql(code) {
    // Pre-process block comments /* ... */ (can span multiple lines)
    // Replace them with a placeholder, then restore as green spans
    const BCOPEN = '\x00BCOPEN\x00';
    const BCCLOSE = '\x00BCCLOSE\x00';
    let processed = '';
    let i = 0;
    let inBlock = false;
    while (i < code.length) {
      if (!inBlock && code[i] === '/' && code[i+1] === '*') {
        processed += BCOPEN;
        inBlock = true;
        i += 2;
      } else if (inBlock && code[i] === '*' && code[i+1] === '/') {
        processed += BCCLOSE;
        inBlock = false;
        i += 2;
      } else {
        processed += code[i];
        i++;
      }
    }
  
    const lines = processed.split('\n');
    let insideBlock = false;
    const result = lines.map(line => {
      let out = '';
      let j = 0;
      while (j < line.length) {
        const openIdx = line.indexOf(BCOPEN, j);
        const closeIdx = line.indexOf(BCCLOSE, j);
  
        if (!insideBlock) {
          if (openIdx !== -1) {
            // highlight part before block comment normally
            out += highlightLine(line.slice(j, openIdx));
            insideBlock = true;
            out += '<span class="c">/*';
            j = openIdx + BCOPEN.length;
          } else {
            out += highlightLine(line.slice(j));
            j = line.length;
          }
        } else {
          // inside block comment
          if (closeIdx !== -1) {
            out += escHtml(line.slice(j, closeIdx)) + '*/</span>';
            insideBlock = false;
            j = closeIdx + BCCLOSE.length;
          } else {
            out += escHtml(line.slice(j));
            if (insideBlock) out += '</span>';
            j = line.length;
            insideBlock = true; // continues on next line
          }
        }
      }
      if (insideBlock && !out.endsWith('</span>')) {
        // block comment open at end of line, close span for this line display
        out += '</span>';
      }
      return out;
    });
  
    return result.join('\n');
  }
  function toggleToken() {
    const box = document.getElementById('token-box');
    box.style.display = box.style.display === 'block' ? 'none' : 'block';
  }
  function copyToken() {
    navigator.clipboard.writeText('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')
      .then(() => {
        const box = document.getElementById('token-box');
        const orig = box.textContent;
        box.textContent = '✓ Copiado';
        setTimeout(() => { box.textContent = orig; }, 1200);
      });
  }
  function highlightLine(line) {
    // If full line is a comment
    if (/^\s*--/.test(line)) {
      return `<span class="c">${escHtml(line)}</span>`;
    }
  
    let result = '';
    let i = 0;
    const raw = line;
  
    while (i < raw.length) {
      // Comment from here to end
      if (raw[i] === '-' && raw[i+1] === '-') {
        result += `<span class="c">${escHtml(raw.slice(i))}</span>`;
        break;
      }
  
      // String
      if (raw[i] === "'") {
        let j = i + 1;
        while (j < raw.length && raw[j] !== "'") j++;
        result += `<span class="s">${escHtml(raw.slice(i, j+1))}</span>`;
        i = j + 1;
        continue;
      }
  
      // Number
      if (/\d/.test(raw[i]) && (i === 0 || /[\s,(=<>!]/.test(raw[i-1]))) {
        let j = i;
        while (j < raw.length && /[\d.]/.test(raw[j])) j++;
        result += `<span class="n">${escHtml(raw.slice(i,j))}</span>`;
        i = j;
        continue;
      }
  
      // Word (keyword, function, or plain)
      if (/[a-zA-Z_]/.test(raw[i])) {
        let j = i;
        while (j < raw.length && /[a-zA-Z0-9_]/.test(raw[j])) j++;
        const word = raw.slice(i, j);
        const up = word.toUpperCase();
  
        // Check if followed by (
        const nextNonSpace = raw.slice(j).trimStart();
        const isFunc = nextNonSpace.startsWith('(');
  
        if (SQL_TYPES.has(up)) {
          result += `<span class="t">${escHtml(word)}</span>`;
        } else if (SQL_FUNCS.has(up) || isFunc) {
          result += `<span class="f">${escHtml(word)}</span>`;
        } else if (SQL_KEYWORDS.has(up)) {
          result += `<span class="k">${escHtml(word)}</span>`;
        } else {
          result += escHtml(word);
        }
        i = j;
        continue;
      }
  
      result += escHtml(raw[i]);
      i++;
    }
  
    return result;
  }
  
  function updateLineNumbers(count) {
    const capped = Math.min(count, 2500);
    let h = '';
    for (let i = 1; i <= capped; i++) {
      h += `<div>${i}</div>`;
    }
    lineNums.innerHTML = h;
  }
  
  function updateStatus() {
    const text = textarea.value;
    const lines = text.split('\n');
    const pos = textarea.selectionStart;
    const before = text.slice(0, pos);
    const ln = before.split('\n').length;
    const col = before.split('\n').pop().length + 1;
  
    document.getElementById('st-length').textContent = `length: ${text.length}`;
    document.getElementById('st-lines').textContent = `lines: ${lines.length}`;
    document.getElementById('st-pos').textContent = `Ln: ${ln}  Col: ${col}  Pos: ${pos}`;
  }
  
  function onEdit() {
    const text = textarea.value;
    const lines = text.split('\n');
    // Cap at 2500 lines
    if (lines.length > 2500) {
      textarea.value = lines.slice(0, 2500).join('\n');
      return onEdit();
    }
    highlight.innerHTML = highlight_sql(text) + '\n';
    updateLineNumbers(Math.max(lines.length, 30));
    syncHeight();
    updateStatus();
    updateActiveLine();
  }
  
  function syncHeight() {
    const minH = Math.max(textarea.scrollHeight, document.getElementById('editor-scroll').clientHeight);
    highlight.style.minHeight = minH + 'px';
    textarea.style.minHeight = minH + 'px';
  }
  
  function syncScroll() {
    const scrollTop = textarea.scrollTop;
    highlight.style.transform = `translateY(-${scrollTop}px)`;
    lineNums.style.transform = `translateY(-${scrollTop}px)`;
    // Move active line highlight with scroll
    const el = document.getElementById('active-line-el');
    if (el) {
      const text = textarea.value;
      const pos = textarea.selectionStart;
      const before = text.slice(0, pos);
      const lineNum = before.split('\n').length;
      const topOffset = 4 + (lineNum - 1) * 19 - scrollTop;
      el.style.top = topOffset + 'px';
    }
  }
  
  function handleTab(e) {
    if (e.key === 'Tab') {
      e.preventDefault();
      const s = textarea.selectionStart;
      const v = textarea.value;
      textarea.value = v.slice(0, s) + '    ' + v.slice(textarea.selectionEnd);
      textarea.selectionStart = textarea.selectionEnd = s + 4;
      onEdit();
    }
  }
  
  textarea.addEventListener('click', () => { updateStatus(); updateActiveLine(); });
  textarea.addEventListener('keyup', () => { updateStatus(); updateActiveLine(); });
  
  // Ctrl + Shift derecho = abrir IA / Esc = cerrar IA
  document.addEventListener('keydown', (e) => {
    if (e.ctrlKey && e.key === 'Shift' && e.location === 2) {
      e.preventDefault();
      document.getElementById('ai-panel').classList.add('open');
      setTimeout(() => document.getElementById('ai-input')?.focus(), 50);
    }
    if (e.key === 'Escape') {
      document.getElementById('ai-panel').classList.remove('open');
      textarea.focus();
    }
  });
  
  function updateActiveLine() {
    const text = textarea.value;
    const pos = textarea.selectionStart;
    const before = text.slice(0, pos);
    const lineNum = before.split('\n').length;
    const topOffset = 4 + (lineNum - 1) * 19 - textarea.scrollTop;
    let el = document.getElementById('active-line-el');
    if (!el) {
      el = document.createElement('div');
      el.id = 'active-line-el';
      el.className = 'active-line-highlight';
      document.getElementById('editor-content').appendChild(el);
    }
    el.style.top = topOffset + 'px';
  }
  
  // Init
  updateLineNumbers(40);
  onEdit();
  
  // Cargar Groq API key guardada
  (function() {
    const saved = sessionStorage.getItem('groq_key');
    if (saved) window._groqKey = saved;
  })();
  
  
  // ── AI ──
  const SYSTEM = `Eres un tutor de SQL especializado ÚNICAMENTE en la materia de base de datos de un estudiante universitario chileno. Responde siempre en español simple y directo.
  
  MATERIA: Oracle SQL Plus. DDL (CREATE TABLE, ALTER TABLE, DROP TABLE CASCADE CONSTRAINTS), DML (SELECT, INSERT, UPDATE, DELETE), TCL (COMMIT, ROLLBACK, SAVEPOINT), Filtros (WHERE, BETWEEN, LIKE, IN, IS NULL, AND, OR, ORDER BY, GROUP BY, HAVING, COUNT, SUM, AVG, MAX, MIN), Subconsultas, Integridad referencial FK.
  
  REGLAS CLAVE:
  - Textos con comillas simples. Números sin comillas.
  - Fechas: DATE '2024-01-15' o TO_DATE('01-01-2000','DD-MM-YYYY')
  - Sin WHERE en UPDATE/DELETE afecta TODOS los registros
  - BETWEEN es inclusivo (incluye los extremos)
  - Cuando el enunciado dice "Y" entre condiciones opuestas (ej: menos de 20 Y más de 300), usar OR no AND
  - Orden FK: insertar primero tablas sin FK (padres), luego hijas
  - DROP elimina tabla completa. DELETE elimina filas.
  - COMMIT guarda. ROLLBACK deshace.
  
  MODELOS: EDITORIAL(IDEDIT PK, NOMEDIT, ANYO_FUNDA) → LIBRO(IDLIBRO PK, IDEDIT FK, TITULO, FECHA_PUBLIC, CANT_PAG). También: PROVEEDORES(NIF PK) → PRODUCTOS(CODIGO PK, NIF FK) ← VENTAS(NUM_BOLETA, COD_PROD FK, CANT_VENTA, DNI_CLI FK) → CLIENTES(DNI PK, APELLIDO, NOMBRE, FECHA_NAC).
  
  FORMATO: Da siempre el comando SQL listo entre bloques de código. Sé muy breve. Si no es de esta materia, dilo amablemente.`;
  
  let aiMessages = [];
  let aiLoading = false;
  
  function toggleAI() {
    const panel = document.getElementById('ai-panel');
    panel.classList.toggle('open');
  }
  
  function aiKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      aiSend();
    }
  }
  
  function aiResize(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 80) + 'px';
  }
  
  async function aiSend() {
    const input = document.getElementById('ai-input');
    const text = input.value.trim();
    if (!text || aiLoading) return;
  
    input.value = '';
    input.style.height = 'auto';
    aiMessages.push({ role: 'user', content: text });
    appendAIMsg('user', text);
  
    const typingEl = document.createElement('div');
    typingEl.className = 'ai-typing';
    typingEl.id = 'ai-typing';
    typingEl.textContent = '...';
    document.getElementById('ai-messages').appendChild(typingEl);
    scrollAI();
  
    aiLoading = true;
  
    // ── Obtener o pedir la Groq key ──
    if (!window._groqKey) {
      document.getElementById('ai-typing')?.remove();
      aiMessages.pop();
      aiLoading = false;
  
      const key = prompt(
        '🔑 Groq API Key — GRATIS (sin tarjeta)\n\n' +
        'Pasos (1 minuto):\n' +
        '1. Ve a:  console.groq.com\n' +
        '2. Crea cuenta gratis con tu Gmail\n' +
        '3. Click en "API Keys" → "Create API Key"\n' +
        '4. Copia la key (empieza con gsk_...)\n' +
        '5. Pégala aquí:\n'
      );
  
      if (key && key.trim().length > 10) {
        window._groqKey = key.trim();
        sessionStorage.setItem('groq_key', key.trim());
        appendAIMsg('ai', '✓ Key guardada. Ahora escribe tu pregunta.');
      } else {
        appendAIMsg('ai', 'Sin key. Ve a console.groq.com para obtener una gratis.');
      }
      return;
    }
  
    try {
      // Groq — 100% gratuito, 14400 req/día, sin tarjeta, CORS permitido
      const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${window._groqKey}`
        },
        body: JSON.stringify({
          model: 'llama-3.1-8b-instant',
          messages: [
            { role: 'system', content: SYSTEM },
            ...aiMessages.slice(-12)
          ],
          max_tokens: 600,
          temperature: 0.3
        })
      });
  
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        if (res.status === 429) {
          const retryAfter = err.error?.message?.match(/try again in ([\d.]+)s/i);
          const wait = retryAfter ? Math.ceil(parseFloat(retryAfter[1])) : 30;
          document.getElementById('ai-typing')?.remove();
          aiMessages.pop();
          aiLoading = false;
          appendAIMsg('ai', `⚠️ Demasiadas solicitudes. Espera ${wait} segundos e intenta de nuevo.`);
          return;
        }
        if (res.status === 401) {
          window._groqKey = null;
          sessionStorage.removeItem('groq_key');
          document.getElementById('ai-typing')?.remove();
          aiMessages.pop();
          aiLoading = false;
          appendAIMsg('ai', '❌ Key inválida. Vuelve a enviar tu pregunta para ingresar una nueva.');
          return;
        }
        throw new Error(err.error?.message || 'HTTP ' + res.status);
      }
  
      const data = await res.json();
      const reply = data.choices?.[0]?.message?.content || 'Sin respuesta.';
      document.getElementById('ai-typing')?.remove();
      aiMessages.push({ role: 'assistant', content: reply });
      appendAIMsg('ai', reply);
  
    } catch(e) {
      document.getElementById('ai-typing')?.remove();
      appendAIMsg('ai', 'Error de conexión: ' + e.message);
    }
  
    aiLoading = false;
  }
  
  function scrollAI() {
    const msgs = document.getElementById('ai-messages');
    msgs.scrollTop = msgs.scrollHeight;
  }
  
  function formatAI(text) {
    let h = text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    h = h.replace(/```sql\n?([\s\S]*?)```/g, (_,c) => `<pre>${c.trim()}</pre>`);
    h = h.replace(/```([\s\S]*?)```/g, (_,c) => `<pre>${c.trim()}</pre>`);
    h = h.replace(/`([^`]+)`/g, '<code>$1</code>');
    h = h.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    h = h.replace(/\n/g, '<br>');
    return h;
  }
