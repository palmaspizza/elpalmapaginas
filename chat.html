<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Firebase Chat & Canvas</title>
    <style>
        :root {
            --primary: #6366f1;
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f8fafc;
        }

        body { 
            font-family: 'Inter', system-ui, sans-serif; 
            background: var(--bg); 
            color: var(--text);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        #login-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .login-box {
            background: var(--card);
            padding: 2rem;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        #canvas-container {
            position: fixed;
            top: 0; left: 0;
            z-index: 10;
            pointer-events: none;
        }
        canvas { cursor: crosshair; pointer-events: auto; }

        .container { 
            background: var(--card); 
            padding: 2rem; 
            border-radius: 16px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.3); 
            width: 90%; 
            max-width: 500px; 
            margin-top: 20px;
            z-index: 20;
        }

        h2 { color: var(--primary); margin-bottom: 1.5rem; text-align: center; }

        .form-group { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
        
        .input-row { display: flex; gap: 10px; }

        input[type="text"] { 
            flex: 1; 
            padding: 12px; 
            border: 1px solid #334155; 
            background: #0f172a;
            color: white;
            border-radius: 8px; 
            outline: none; 
        }

        .btn-subir { 
            background: var(--primary); 
            color: white; 
            border: none; 
            padding: 12px 20px; 
            border-radius: 8px; 
            cursor: pointer; 
            font-weight: bold;
        }

        .btn-subir:disabled { background: #475569; opacity: 0.6; }

        #lista { list-style: none; padding: 0; max-height: 400px; overflow-y: auto; }
        
        li { 
            background: #334155; 
            padding: 15px; 
            margin-bottom: 12px; 
            border-radius: 12px; 
            display: flex; 
            flex-direction: column;
            gap: 5px;
        }

        .user-name { font-weight: bold; color: var(--primary); font-size: 0.9rem; }
        .img-post { width: 100%; border-radius: 8px; margin-top: 10px; }

        .btn-borrar { 
            align-self: flex-end;
            background: #ef4444; 
            color: white; 
            border: none; 
            padding: 6px 12px; 
            border-radius: 6px; 
            cursor: pointer; 
            font-size: 0.75rem;
            margin-top: 5px;
        }
        
        #cooldown-timer { font-size: 0.8rem; color: #94a3b8; text-align: center; height: 1rem; }
    </style>
</head>
<body>

<div id="login-overlay">
    <div class="login-box">
        <h2>¿Quién eres?</h2>
        <input type="text" id="nombreUsuario" placeholder="Tu nombre..." style="margin-bottom: 15px; width: 80%;">
        <br>
        <button id="btnEntrar" class="btn-subir">Entrar al Chat</button>
    </div>
</div>

<div id="canvas-container">
    <canvas id="dibujoCanvas"></canvas>
</div>

<div class="container">
    <h2 id="saludoChat">✨ Firebase Social</h2>
    
    <div class="form-group">
        <div class="input-row">
            <input type="text" id="textoInput" placeholder="Escribe un mensaje y pulsa Enter...">
            <button id="btnEnviar" class="btn-subir">Enviar</button>
        </div>
        <input type="file" id="fotoInput" accept="image/*" style="font-size: 0.8rem; color: #94a3b8;">
        <div id="cooldown-timer"></div>
    </div>

    <ul id="lista"></ul>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-app.js";
    import { getDatabase, ref, push, onValue, remove } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBKPYmxIBVFPYvSKJapm2B9lyW_7SBL_fs",
        authDomain: "palmaxd-32720.firebaseapp.com",
        databaseURL: "https://palmaxd-32720-default-rtdb.firebaseio.com",
        projectId: "palmaxd-32720",
        storageBucket: "palmaxd-32720.firebasestorage.app",
        messagingSenderId: "527831930817",
        appId: "1:527831930817:web:05fcfd4b53296068d4c140"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const dbRef = ref(db, "posteos");

    if (!sessionStorage.getItem('userId')) {
        sessionStorage.setItem('userId', 'user_' + Math.random().toString(36).substr(2, 9));
    }
    const myId = sessionStorage.getItem('userId');
    let usuarioActual = "";

    const loginOverlay = document.getElementById('login-overlay');
    const inputNombre = document.getElementById('nombreUsuario');
    const btnEntrar = document.getElementById('btnEntrar');

    btnEntrar.onclick = () => {
        if (inputNombre.value.trim() !== "") {
            usuarioActual = inputNombre.value.trim();
            loginOverlay.style.display = "none";
            document.getElementById('saludoChat').textContent = `Hola, ${usuarioActual}`;
        }
    };

    const canvas = document.getElementById('dibujoCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    let dibujando = false;
    canvas.onmousedown = () => dibujando = true;
    canvas.onmouseup = () => {
        dibujando = false;
        ctx.beginPath();
        setTimeout(() => ctx.clearRect(0, 0, canvas.width, canvas.height), 4000);
    };
    canvas.onmousemove = (e) => {
        if (!dibujando) return;
        ctx.lineWidth = 3; ctx.lineCap = "round"; ctx.strokeStyle = "#6366f1";
        ctx.lineTo(e.clientX, e.clientY); ctx.stroke(); ctx.beginPath(); ctx.moveTo(e.clientX, e.clientY);
    };

    const input = document.getElementById('textoInput');
    const fotoInput = document.getElementById('fotoInput');
    const btn = document.getElementById('btnEnviar');
    const listaUI = document.getElementById('lista');
    const cooldownLabel = document.getElementById('cooldown-timer');

    // Función para convertir imagen a Base64
    const toBase64 = file => new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result);
        reader.onerror = error => reject(error);
    });

    async function enviarMensaje() {
        if (btn.disabled) return;
        const mensaje = input.value;
        const archivo = fotoInput.files[0];
        if (mensaje.trim() === "" && !archivo) return;

        btn.disabled = true;
        let timeLeft = 3;
        const interval = setInterval(() => {
            cooldownLabel.textContent = `Espera ${timeLeft}s...`;
            timeLeft--;
            if (timeLeft < 0) { clearInterval(interval); btn.disabled = false; cooldownLabel.textContent = ""; }
        }, 1000);

        let imgData = null;
        if (archivo) {
            // Convertimos la imagen a texto (Base64) para guardarla en la DB
            imgData = await toBase64(archivo);
        }

        push(dbRef, {
            uid: myId,
            usuario: usuarioActual,
            texto: mensaje,
            foto: imgData, // Se guarda la cadena de texto de la imagen
            hora: new Date().toLocaleString()
        });

        input.value = ""; fotoInput.value = "";
    }

    btn.onclick = enviarMensaje;
    input.addEventListener('keypress', (e) => { if (e.key === 'Enter') enviarMensaje(); });
    inputNombre.addEventListener('keypress', (e) => { if (e.key === 'Enter') btnEntrar.onclick(); });

    onValue(dbRef, (snapshot) => {
        listaUI.innerHTML = "";
        const data = snapshot.val();
        if (data) {
            Object.entries(data).reverse().forEach(([id, item]) => {
                const li = document.createElement('li');
                let contenidoHtml = `<span class="user-name">${item.usuario || 'Anónimo'}:</span>`;
                if(item.texto) contenidoHtml += `<span>${item.texto}</span>`;
                if (item.foto) contenidoHtml += `<img src="${item.foto}" class="img-post">`;
                li.innerHTML = contenidoHtml;

                if (item.uid === myId) {
                    const btnBorrar = document.createElement('button');
                    btnBorrar.textContent = "Eliminar";
                    btnBorrar.className = "btn-borrar";
                    btnBorrar.onclick = () => remove(ref(db, `posteos/${id}`));
                    li.appendChild(btnBorrar);
                }
                listaUI.appendChild(li);
            });
        }
    });

    window.onresize = () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; };
</script>

</body>
</html>
