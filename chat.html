<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firebase App con Borrado</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; display: flex; justify-content: center; padding-top: 50px; }
        .container { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 450px; }
        h2 { color: #1a73e8; margin-top: 0; }
        .form-group { display: flex; gap: 10px; margin-bottom: 20px; }
        input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 6px; outline: none; }
        .btn-subir { background: #1a73e8; color: white; border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        
        #lista { list-style: none; padding: 0; }
        li { 
            background: #f8f9fa; 
            padding: 10px; 
            margin-bottom: 8px; 
            border-radius: 6px; 
            border-left: 5px solid #1a73e8; 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            word-break: break-word;
        }
        .btn-borrar { 
            background: #ff4d4d; 
            color: white; 
            border: none; 
            padding: 5px 10px; 
            border-radius: 4px; 
            cursor: pointer; 
            font-size: 0.8rem;
            margin-left: 10px;
        }
        .btn-borrar:hover { background: #cc0000; }
    </style>
</head>
<body>

<div class="container">
    <h2>Mensajes</h2>
    
    <div class="form-group">
        <input type="text" id="textoInput" placeholder="Escribe algo...">
        <button id="btnEnviar" class="btn-subir">Subir</button>
    </div>

    <ul id="lista"></ul>
</div>

<script type="module">
    // 1. Importar remove de la base de datos
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-app.js";
    import { getDatabase, ref, push, onValue, remove } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBKPYmxIBVFPYvSKJapm2B9lyW_7SBL_fs",
        authDomain: "palmaxd-32720.firebaseapp.com",
        databaseURL: "https://palmaxd-32720-default-rtdb.firebaseio.com",
        projectId: "palmaxd-32720",
        storageBucket: "palmaxd-32720.firebasestorage.app",
        messagingSenderId: "527831930817",
        appId: "1:527831930817:web:05fcfd4b53296068d4c140"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const dbRef = ref(db, "posteos");

    const input = document.getElementById('textoInput');
    const btn = document.getElementById('btnEnviar');
    const listaUI = document.getElementById('lista');

    // SUBIR DATOS
    btn.addEventListener('click', () => {
        const mensaje = input.value;
        if (mensaje.trim() !== "") {
            push(dbRef, {
                texto: mensaje,
                hora: new Date().toLocaleString()
            });
            input.value = "";
        }
    });

    // MOSTRAR DATOS Y BOTÓN ELIMINAR
    onValue(dbRef, (snapshot) => {
        listaUI.innerHTML = "";
        const data = snapshot.val();
        
        if (data) {
            // Usamos Object.entries para obtener el ID (key) y el contenido (value)
            Object.entries(data).reverse().forEach(([id, item]) => {
                const li = document.createElement('li');
                
                // Texto del mensaje
                const span = document.createElement('span');
                span.textContent = item.texto;
                
                // Botón de eliminar
                const btnBorrar = document.createElement('button');
                btnBorrar.textContent = "Eliminar";
                btnBorrar.className = "btn-borrar";
                
                // Evento para eliminar de Firebase
                btnBorrar.onclick = () => {
                    const itemRef = ref(db, `posteos/${id}`);
                    remove(itemRef);
                };

                li.appendChild(span);
                li.appendChild(btnBorrar);
                listaUI.appendChild(li);
            });
        }
    });
</script>

</body>
</html>
