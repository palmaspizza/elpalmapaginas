<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firebase Realtime Chat & Canvas</title>
    <style>
        :root { --primary: #6366f1; --bg: #0f172a; --card: #1e293b; --text: #f8fafc; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; overflow: hidden; }
        
        #login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg); display: flex; justify-content: center; align-items: center; z-index: 100; }
        .login-box { background: var(--card); padding: 2rem; border-radius: 16px; text-align: center; }

        #canvas-container { position: fixed; top: 0; left: 0; z-index: 10; pointer-events: none; }
        canvas { cursor: crosshair; pointer-events: auto; }

        .controls { position: fixed; top: 20px; left: 20px; z-index: 30; background: var(--card); padding: 10px; border-radius: 12px; display: flex; gap: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); pointer-events: auto; }
        .color-btn { width: 25px; height: 25px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; transition: transform 0.2s; }
        .color-btn.active { border-color: white; transform: scale(1.2); }

        .container { background: var(--card); padding: 1.5rem; border-radius: 16px; width: 90%; max-width: 450px; margin-top: 80px; z-index: 20; position: relative; max-height: 80vh; display: flex; flex-direction: column; }
        .form-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 15px; }
        .input-row { display: flex; gap: 8px; }
        input[type="text"] { flex: 1; padding: 10px; border: 1px solid #334155; background: #0f172a; color: white; border-radius: 8px; outline: none; }
        .btn-subir { background: var(--primary); color: white; border: none; padding: 10px 15px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .btn-subir:disabled { opacity: 0.5; }

        #lista { list-style: none; padding: 0; overflow-y: auto; flex: 1; }
        li { background: #334155; padding: 12px; margin-bottom: 10px; border-radius: 10px; display: flex; flex-direction: column; }
        .user-name { font-weight: bold; color: var(--primary); margin-bottom: 4px; }
        .img-post { width: 100%; border-radius: 8px; margin-top: 8px; }
        .btn-borrar { align-self: flex-end; background: #ef4444; color: white; border: none; padding: 4px 8px; border-radius: 4px; font-size: 0.7rem; cursor: pointer; }
        #cooldown-timer { font-size: 0.75rem; color: #94a3b8; text-align: center; min-height: 1rem; }
    </style>
</head>
<body>

<div id="login-overlay">
    <div class="login-box">
        <h2>Tu Nombre</h2>
        <input type="text" id="nombreUsuario" placeholder="Escribe aquí...">
        <button id="btnEntrar" class="btn-subir" style="margin-top:10px; width: 100%;">Entrar</button>
    </div>
</div>

<div class="controls" id="colorPicker">
    <div class="color-btn active" style="background: #6366f1;" data-color="#6366f1"></div>
    <div class="color-btn" style="background: #ef4444;" data-color="#ef4444"></div>
    <div class="color-btn" style="background: #22c55e;" data-color="#22c55e"></div>
    <div class="color-btn" style="background: #eab308;" data-color="#eab308"></div>
    <div class="color-btn" style="background: #ec4899;" data-color="#ec4899"></div>
    <div class="color-btn" style="background: #ffffff;" data-color="#ffffff"></div>
</div>

<div id="canvas-container">
    <canvas id="dibujoCanvas"></canvas>
</div>

<div class="container">
    <div class="form-group">
        <div class="input-row">
            <input type="text" id="textoInput" placeholder="Mensaje...">
            <button id="btnEnviar" class="btn-subir">Enviar</button>
        </div>
        <input type="file" id="fotoInput" accept="image/*" style="font-size: 0.7rem;">
        <div id="cooldown-timer"></div>
    </div>
    <ul id="lista"></ul>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-app.js";
    import { getDatabase, ref, push, onValue, remove, set, onChildAdded } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBKPYmxIBVFPYvSKJapm2B9lyW_7SBL_fs",
        authDomain: "palmaxd-32720.firebaseapp.com",
        databaseURL: "https://palmaxd-32720-default-rtdb.firebaseio.com",
        projectId: "palmaxd-32720",
        storageBucket: "palmaxd-32720.firebasestorage.app",
        messagingSenderId: "527831930817",
        appId: "1:527831930817:web:05fcfd4b53296068d4c140"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const myId = 'u_' + Math.random().toString(36).substr(2, 9);
    let usuarioActual = "";
    let colorSeleccionado = "#6366f1";

    // LOGIN
    document.getElementById('btnEntrar').onclick = () => {
        const nom = document.getElementById('nombreUsuario').value.trim();
        if (nom) { usuarioActual = nom; document.getElementById('login-overlay').style.display = "none"; }
    };

    // PALETA
    document.querySelectorAll('.color-btn').forEach(btn => {
        btn.onclick = () => {
            document.querySelector('.color-btn.active').classList.remove('active');
            btn.classList.add('active');
            colorSeleccionado = btn.dataset.color;
        };
    });

    // --- DIBUJO ---
    const canvas = document.getElementById('dibujoCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth; canvas.height = window.innerHeight;
    
    let ultimosPuntos = {}; // Guardar el último punto de cada usuario para conectar líneas

    canvas.onmousedown = () => { window.dibujandoAhora = true; };
    canvas.onmouseup = () => { 
        window.dibujandoAhora = false; 
        // Solo enviamos la señal de borrado si no hay más trazos activos
        setTimeout(() => { if(!window.dibujandoAhora) set(ref(db, `dibujos`), null); }, 10000); 
    };

    canvas.onmousemove = (e) => {
        if (!window.dibujandoAhora) return;
        push(ref(db, `dibujos/${myId}`), { x: e.clientX, y: e.clientY, c: colorSeleccionado });
    };

    // Escuchar cuando se borra todo
    onValue(ref(db, "dibujos"), (snap) => {
        if (!snap.exists()) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ultimosPuntos = {};
        }
    });

    // Dibujar cada punto nuevo que llega de CUALQUIER usuario
    onChildAdded(ref(db, "dibujos"), (userSnap) => {
        const userId = userSnap.key;
        onChildAdded(ref(db, `dibujos/${userId}`), (pointSnap) => {
            const p = pointSnap.val();
            ctx.beginPath();
            ctx.lineWidth = 3; ctx.lineCap = "round"; ctx.strokeStyle = p.c;
            
            if (ultimosPuntos[userId]) {
                ctx.moveTo(ultimosPuntos[userId].x, ultimosPuntos[userId].y);
                ctx.lineTo(p.x, p.y);
                ctx.stroke();
            }
            ultimosPuntos[userId] = p;
        });
    });

    // --- CHAT ---
    const input = document.getElementById('textoInput');
    const fotoInput = document.getElementById('fotoInput');
    const btn = document.getElementById('btnEnviar');
    const cooldownLabel = document.getElementById('cooldown-timer');

    async function enviarMensaje() {
        if (btn.disabled || (input.value.trim() === "" && !fotoInput.files[0])) return;
        btn.disabled = true;
        let timeLeft = 3;
        const timer = setInterval(() => {
            cooldownLabel.textContent = `Espera ${timeLeft}s...`;
            if (timeLeft <= 0) { clearInterval(timer); btn.disabled = false; cooldownLabel.textContent = ""; }
            timeLeft--;
        }, 1000);

        let imgData = null;
        if (fotoInput.files[0]) {
            const reader = new FileReader();
            imgData = await new Promise(res => {
                reader.onload = () => res(reader.result);
                reader.readAsDataURL(fotoInput.files[0]);
            });
        }
        
        push(ref(db, "posteos"), { uid: myId, usuario: usuarioActual, texto: input.value, foto: imgData });
        input.value = ""; fotoInput.value = "";
    }

    btn.onclick = enviarMensaje;
    input.onkeypress = (e) => { if (e.key === 'Enter') enviarMensaje(); };

    onValue(ref(db, "posteos"), (snapshot) => {
        const listaUI = document.getElementById('lista');
        listaUI.innerHTML = "";
        const data = snapshot.val();
        if (data) {
            Object.entries(data).reverse().forEach(([id, item]) => {
                const li = document.createElement('li');
                li.innerHTML = `<span class="user-name">${item.usuario}:</span><span>${item.texto}</span>`;
                if (item.foto) li.innerHTML += `<img src="${item.foto}" class="img-post">`;
                if (item.uid === myId) {
                    const b = document.createElement('button'); b.textContent = "Borrar"; b.className = "btn-borrar";
                    b.onclick = () => remove(ref(db, `posteos/${id}`));
                    li.appendChild(b);
                }
                listaUI.appendChild(li);
            });
        }
    });

    window.onresize = () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; };
</script>
</body>
</html>
