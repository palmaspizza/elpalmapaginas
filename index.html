<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Llamadas Fáciles - Para Adultos Mayores</title>
    <link rel="stylesheet" href="style.css">
    <base target="_blank">

    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f0f4ff; }

        /* ===== PANTALLA LLAMADA ACTIVA ===== */
        #pantalla-llamada {
            display: none;
            position: fixed; inset: 0;
            background: linear-gradient(160deg, #1a1a2e 0%, #16213e 60%, #0f3460 100%);
            z-index: 9000;
            justify-content: center;
            align-items: center;
        }
        .contenedor-llamada {
            display: flex; flex-direction: column;
            align-items: center; gap: 18px;
            width: 100%; padding: 40px 20px;
        }

        /* Foto en llamada activa */
        .avatar-llamada {
            width: 160px; height: 160px;
            border-radius: 50%;
            border: 5px solid #4fc3f7;
            box-shadow: 0 0 0 8px rgba(79,195,247,.25), 0 0 40px rgba(79,195,247,.3);
            font-size: 80px;
            display: flex; align-items: center; justify-content: center;
            background: #263547; color: #fff;
            overflow: hidden;
            animation: pulsoSuave 2s infinite;
        }
        .avatar-llamada img {
            width: 100%; height: 100%;
            object-fit: cover; border-radius: 50%;
        }
        @keyframes pulsoSuave {
            0%,100% { box-shadow: 0 0 0 8px rgba(79,195,247,.25), 0 0 40px rgba(79,195,247,.3); }
            50%      { box-shadow: 0 0 0 18px rgba(79,195,247,.10), 0 0 60px rgba(79,195,247,.5); }
        }
        .nombre-llamada { font-size: 2.6em; font-weight: 900; color: #fff; text-align: center; }
        .estado-llamada  { font-size: 1.5em; color: #4fc3f7; font-weight: 600; }
        .timer-llamada   { font-size: 3em; font-weight: 900; color: #fff; letter-spacing: 4px; font-variant-numeric: tabular-nums; }
        .controles-llamada { margin-top: 20px; }

        /* Botón colgar (compartido) */
        .btn-colgar {
            background: linear-gradient(135deg, #e63946, #c1121f);
            color: #fff; font-size: 1.8em; font-weight: 900;
            padding: 22px 55px; border: none; border-radius: 60px;
            cursor: pointer; box-shadow: 0 8px 25px rgba(230,57,70,.5);
            letter-spacing: 1px; touch-action: manipulation;
            transition: transform .15s, box-shadow .15s;
        }
        .btn-colgar:active { transform: scale(.95); }

        /* ===== PANTALLA LLAMADA ENTRANTE ===== */
        #notificacion-entrante {
            display: none;
            position: fixed; inset: 0;
            background: linear-gradient(160deg, #0d2137 0%, #1a3a5c 60%, #0f3460 100%);
            z-index: 9500;
            flex-direction: column; justify-content: center; align-items: center;
            gap: 22px; padding: 30px 20px;
        }
        .nombre-entrante { font-size: 3em; font-weight: 900; color: #fff; text-align: center; }
        .texto-entrante  { font-size: 1.8em; font-weight: 700; color: #90caf9; }

        /* Foto entrante con anillo pulsante */
        .foto-entrante-wrapper {
            position: relative; width: 180px; height: 180px;
            display: flex; align-items: center; justify-content: center;
        }
        .anillo-pulso {
            position: absolute; inset: -14px;
            border-radius: 50%;
            border: 5px solid rgba(79,195,247,.5);
            animation: ringPulse 1.4s ease-out infinite;
        }
        .anillo-pulso::after {
            content: ''; position: absolute; inset: -14px;
            border-radius: 50%; border: 5px solid rgba(79,195,247,.25);
            animation: ringPulse 1.4s ease-out infinite .45s;
        }
        @keyframes ringPulse {
            0%   { transform: scale(1);   opacity: 1; }
            100% { transform: scale(1.6); opacity: 0; }
        }
        .foto-entrante {
            width: 180px; height: 180px;
            border-radius: 50%; border: 5px solid #4fc3f7;
            background: #1e3a5f; font-size: 90px;
            display: flex; align-items: center; justify-content: center;
            color: #fff; overflow: hidden;
            box-shadow: 0 8px 30px rgba(0,0,0,.4);
        }
        .foto-entrante img {
            width: 100%; height: 100%;
            object-fit: cover; border-radius: 50%;
        }

        /* Botones aceptar / rechazar */
        .controles-entrante {
            display: flex; gap: 28px;
            margin-top: 16px; flex-wrap: wrap; justify-content: center;
        }
        .btn-aceptar {
            background: linear-gradient(135deg, #2ecc71, #1a9e52);
            color: #fff; font-size: 1.9em; font-weight: 900;
            padding: 26px 42px; border: none; border-radius: 60px;
            cursor: pointer; box-shadow: 0 8px 28px rgba(46,204,113,.5);
            letter-spacing: 1px; touch-action: manipulation;
            transition: transform .15s, box-shadow .15s;
            min-width: 200px;
        }
        .btn-aceptar:active { transform: scale(.95); }
        .controles-entrante .btn-colgar { min-width: 200px; }

        /* Modal */
        .modal {
            display: none; position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,.7);
            justify-content: center; align-items: center;
        }
        .modal-contenido {
            background: white; padding: 2em; border-radius: 10px;
            text-align: center; width: 80%; max-width: 500px;
        }
        .boton-volver {
            background-color: #e63946; color: white;
            font-size: 2.5em; font-weight: bold;
            padding: 1em 2em; border: none; border-radius: 15px; cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- ===== PANTALLA DE INGRESO ===== -->
    <div id="pantalla-ingreso">
        <div class="logo-grande">
            <div class="icono-telefono">📞</div>
            <div>Llamadas Fáciles</div>
        </div>
        <div style="width:100%;display:flex;flex-direction:column;align-items:center;">
            <label class="etiqueta-campo">¿Cómo te llamas?</label>
            <input type="text" id="input-username" class="campo-texto" placeholder="Escribe tu nombre" maxlength="20">
        </div>
        <button class="boton-principal boton-amarillo" onclick="ingresar()">
            ENTRAR 🚪
        </button>
    </div>


    <!-- ===== PANTALLA DE DIRECTORIO ===== -->
    <div id="pantalla-directorio">
        <div class="barra-superior">

            <!-- Hold 4s → abre modal de salida -->
            <div class="titulo-seccion"
                 onmousedown="iniciarHoldDiv()" onmouseup="cancelarHoldDiv()" onmouseleave="cancelarHoldDiv()"
                 ontouchstart="iniciarHoldDiv()" ontouchend="cancelarHoldDiv()">
                📒 PINCHA A ALGUIEN PARA LLAMARLO
            </div>

            <!-- Modal confirmación salida -->
            <div id="modal-volver" onclick="cerrarModalVolver()"
                 style="z-index:10000000000000000000000000 !important;" class="modal">
                <div class="modal-contenido">
                    <h2>¿Seguro que quieres salir?</h2>
                    <!-- Hold 3s sobre VOLVER → cerrar sesión -->
                    <button class="boton-volver"
                            onclick="cerrarModalVolver()"
                            onmousedown="iniciarHoldVolver()" onmouseup="cancelarHoldVolver()" onmouseleave="cancelarHoldVolver()"
                            ontouchstart="iniciarHoldVolver()" ontouchend="cancelarHoldVolver()">
                        VOLVER
                    </button>
                </div>
            </div>

            <script>
                let holdDivTimer, holdVolverTimer;

                function iniciarHoldDiv() {
                    holdDivTimer = setTimeout(() => {
                        document.getElementById('modal-volver').style.display = 'flex';
                    }, 4000);
                }
                function cancelarHoldDiv() { clearTimeout(holdDivTimer); }

                function iniciarHoldVolver() {
                    holdVolverTimer = setTimeout(() => { cerrarSesion(); }, 3000);
                }
                function cancelarHoldVolver() { clearTimeout(holdVolverTimer); }

                window.cerrarSesion = function () {
                    if (llamadaActiva) colgarLlamada();
                    _limpiarListeners();
                    resetEstado();
                    localStorage.removeItem('usuario');
                    usuarioActual = '';
                    document.getElementById('pantalla-directorio').style.display = 'none';
                    document.getElementById('pantalla-ingreso').style.display    = 'flex';
                    document.getElementById('input-username').value = '';
                    document.getElementById('modal-volver').style.display = 'none';
                };

                function cerrarModalVolver() {
                    document.getElementById('modal-volver').style.display = 'none';
                }
            </script>

            <center><br><br>
                <button style="font-size:120%;" class="boton-cerrar-sesion" id="btn-salir-app" onclick="">SALIR</button>
            </center>
        </div>

        <div id="info-palmitas-container"></div>
        <div class="lista-contactos" id="lista-contactos"></div>
    </div>


    <!-- ===== PANTALLA DE LLAMADA ACTIVA ===== -->
    <div id="pantalla-llamada">
        <div class="contenedor-llamada">
            <!--
                El JS debe poner dentro de #avatar-llamada:
                  <img src="URL_FOTO"> si hay foto, o el emoji/? si no.
            -->
            <div class="avatar-llamada" id="avatar-llamada">?</div>

            <div class="nombre-llamada" id="nombre-llamada">Nombre</div>
            <div class="estado-llamada" id="estado-llamada">Conectando...</div>
            <div class="timer-llamada"  id="timer-llamada">00:00</div>

            <div class="controles-llamada" id="controles-llamada">
                <button class="btn-colgar" onclick="colgarLlamada()">📵 COLGAR</button>
            </div>
        </div>
    </div>


    <!-- ===== NOTIFICACIÓN LLAMADA ENTRANTE ===== -->
    <!-- ✅ ÚNICO bloque — duplicado eliminado -->
    <div id="notificacion-entrante">

        <div class="foto-entrante-wrapper">
            <div class="anillo-pulso"></div>
            <!--
                El JS debe poner dentro de #icono-entrante-contenido:
                  <img src="URL_FOTO"> si hay foto, o el emoji si no.
            -->
            <div class="foto-entrante" id="icono-entrante-contenido">📞</div>
        </div>

        <div class="nombre-entrante" id="nombre-entrante">Alguien</div>
        <div class="texto-entrante">Te está llamando...</div>

        <div class="controles-entrante">
            <button class="btn-aceptar" onclick="aceptarLlamadaEntrante()">✅ ACEPTAR</button>
            <button class="btn-colgar"  onclick="rechazarLlamada()">❌ RECHAZAR</button>
        </div>

    </div>


    <script type="module" src="script.js"></script>
</body>
</html>
