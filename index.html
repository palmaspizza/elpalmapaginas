<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Ajedrez Multijugador Online</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css">
    <style>
        /* Prevenir pull-to-refresh en móviles */
        body {
            overscroll-behavior-y: contain;
            touch-action: pan-x pan-y; /* Permitir scroll solo en ejes, pero evitar pull-to-refresh */
            position: fixed;
            width: 100%;
            height: 100%;
            overflow: auto;
        }
        
        /* Prevenir selección de texto durante arrastre */
        * {
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        
        /* Botón de megáfono */
        .mute-btn {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            color: white;
            border: none;
            border-radius: 50px;
            padding: 12px 20px;
            font-size: 24px;
            cursor: pointer;
            z-index: 10000;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
        }
        
        .mute-btn:hover {
            transform: translateX(-50%) scale(1.05);
            background: rgba(0,0,0,0.9);
        }
        
        .mute-btn.muted {
            opacity: 0.8;
        }
        
        /* Overlay de TU TURNO */
        .turn-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 255, 0, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 20000;
            animation: fadeOut 2s ease-in-out forwards;
            pointer-events: none;
        }
        
        .turn-overlay span {
            font-size: 64px;
            font-weight: bold;
            color: white;
            text-shadow: 4px 4px 8px rgba(0,0,0,0.5);
            text-align: center;
            padding: 20px;
            background: rgba(0,0,0,0.3);
            border-radius: 20px;
            animation: pulse 0.5s ease-in-out;
        }
        
        @keyframes fadeOut {
            0% { opacity: 1; }
            70% { opacity: 1; }
            100% { opacity: 0; visibility: hidden; }
        }
        
        @keyframes pulse {
            0% { transform: scale(0.8); opacity: 0; }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }
        
        /* Mejoras táctiles para el tablero */
        .chessboard-container {
            touch-action: none;
        }
        
        .square-55d63 {
            touch-action: none;
        }
    </style>
</head>
<body>
    <!-- Botón de megáfono -->
    <button id="mute-btn" class="mute-btn muted">
        🔇
    </button>
    
    <div class="container">
        <div id="game-container">
            <div id="board-container" style="width: 500px;"></div>
            <div id="game-info">
                <div id="player-info">
                    <div class="player-card" id="player1-card">
                        <i class="fas fa-user"></i>
                        <span id="player1-name">Esperando jugador...</span>
                        <span class="piece-color">♔ Blancas</span>
                    </div>
                    <div class="vs-text">VS</div>
                    <div class="player-card" id="player2-card">
                        <i class="fas fa-user"></i>
                        <span id="player2-name">Esperando jugador...</span>
                        <span class="piece-color">♚ Negras</span>
                    </div>
                </div>
                <div id="turn-indicator">
                    <i class="fas fa-hourglass-half"></i>
                    <span id="turn-text">Esperando partida...</span>
                </div>
                <div id="game-status"></div>
                
                <!-- Sección de piezas capturadas -->
                <div id="captured-pieces-section" style="margin-top: 20px;">
                    <div class="captured-section red" id="captured-red-section">
                        <h4><i class="fas fa-skull"></i> Piezas perdidas: 0</h4>
                        <div id="captured-red-pieces" class="captured-pieces-container"></div>
                    </div>
                    <div class="captured-section green" id="captured-green-section">
                        <h4><i class="fas fa-trophy"></i> Piezas capturadas: 0</h4>
                        <div id="captured-green-pieces" class="captured-pieces-container"></div>
                    </div>
                </div>
                
                <button id="leave-btn" class="btn btn-secondary" style="display: none;">
                    <i class="fas fa-sign-out-alt"></i> Abandonar partida
                </button>
            </div>
        </div>
    </div>

    <div id="overlay" class="overlay">
        <div class="overlay-content">
            <h1><i class="fas fa-chess"></i> Ajedrez Online</h1>
            <div class="form-group">
                <label for="player-name">Ingresa tu nombre:</label>
                <input type="text" id="player-name" placeholder="Ej: Gandalf" maxlength="20" required>
            </div>
            <button id="search-btn" class="btn btn-primary">
                <i class="fas fa-search"></i> Buscar partida
            </button>
            <div id="search-status" class="search-status"></div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>
    <script type="module" src="script.js"></script>
</body>
</html>
