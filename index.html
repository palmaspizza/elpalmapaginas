<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Familia · Videollamada con el Pedro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root {
    --azul-oscuro: #005cfc;
    --azul-medio: #2a5298;
    --azul-claro: #eef3fc;
    --fondo: #3b3b3b;
    --tarjeta: #a5a5a5;
    --texto: #17203a;
    --texto-suave: #fff;
    --linea: #e3e8f4;
    --verde: #1fa855;
    --verde-fuerte: #17924a;
    --rojo: #e5484d;
    --rojo-fuerte: #c73338;
    --ambar: #f5a623;
    --sombra: 0 10px 30px rgba(22, 48, 94, .10);
    --sombra-suave: 0 4px 14px rgba(22, 48, 94, .08);
    --radio: 20px;
  }

  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body {
    font-family:'Nunito', 'Segoe UI', Arial, sans-serif;
    background:var(--fondo);
    color:var(--texto);
    padding-bottom: calc(28px + env(safe-area-inset-bottom));
    -webkit-tap-highlight-color: transparent;
  }
  button { font-family: inherit; }

  /* ============================================================
     ENCABEZADO
     ============================================================ */
  header {
    background:linear-gradient(135deg, var(--azul-oscuro), var(--azul-medio));
    color:#fff;
    padding: calc(20px + env(safe-area-inset-top)) 20px 26px;
    border-radius: 0 0 28px 28px;
    box-shadow: var(--sombra);
    position: relative;
    overflow: hidden;
  }
  header::after {
    content:"";
    position:absolute; right:-40px; top:-40px;
    width:160px; height:160px; border-radius:50%;
    background:radial-gradient(circle, rgba(255,255,255,.14), transparent 70%);
  }
  header .marca { display:flex; align-items:center; gap:12px; }
  header .marca-icono {
    width:44px; height:44px; border-radius:14px;
    background:rgba(255,255,255,.18);
    display:flex; align-items:center; justify-content:center;
    font-size:1.4rem; flex-shrink:0;
  }
  header h1 { font-size:1.15rem; font-weight:800; letter-spacing:.2px; }
  header p.subtitulo { font-size:.85rem; opacity:.85; margin-top:2px; font-weight:600; }

  /* ============================================================
     CONTENEDOR PRINCIPAL
     ============================================================ */
  main#vistaPrincipal {
    max-width: 560px;
    margin: 0 auto;
    padding: 16px;
    display:flex;
    flex-direction:column;
    gap:16px;
  }

  .tarjeta {
    background:var(--tarjeta);
    border-radius: var(--radio);
    box-shadow: var(--sombra-suave);
    overflow:hidden;
  }

  .tarjeta-titulo {
    display:flex; align-items:center; gap:8px;
    font-size:.95rem; font-weight:800; color:var(--azul-oscuro);
    padding: 16px 18px 8px;
  }
  .tarjeta-titulo .punto { font-size:1.1rem; }

  /* ============================================================
     MAPA
     ============================================================ */
  #contenedorMapa { position: relative; width: 100%; }
  #mapa {
    width:100%; height:220px; cursor:pointer;
    transition: height .35s ease;
    z-index: 1;
  }
  body.mapaAgrandado #mapa { height: 82dvh; }
  body.mapaAgrandado #vistaPrincipal > *:not(#tarjetaMapa) { display:none !important; }
  body.mapaAgrandado #tarjetaMapa { box-shadow:none; border-radius:0; }
  body.mapaAgrandado main#vistaPrincipal { padding:0; max-width:100%; }

  #btnCerrarMapa {
    display:none;
    position:absolute; top:14px; left:14px; z-index: 500;
    background:var(--azul-oscuro); color:#5c5c5c; border:none;
    padding: 12px 20px; border-radius: 50px; font-weight:800; font-size:.95rem;
    box-shadow: 0 6px 16px rgba(0,0,0,.28);
    align-items:center; gap:8px; cursor:pointer;
  }
  body.mapaAgrandado #btnCerrarMapa { display:flex; }

  #ultimaUbicacion {
    padding:12px 18px 16px; font-size:.82rem; color:var(--texto-suave); font-weight:600; line-height:1.5;
  }
  #direccionTexto { display:block; font-size:.95rem; font-weight:800; color:var(--texto); margin-top:2px; }

  /* ============================================================
     SELECTOR DE PERFIL
     ============================================================ */
  #tarjetaPerfil { padding-bottom: 16px; }
  .perfiles { display:flex; gap:10px; padding: 4px 16px 0; flex-wrap:wrap; }
  .perfilBtn {
    flex:1; min-width:74px;
    border:2px solid var(--linea); background:var(--fondo);
    border-radius:16px; padding:14px 6px; text-align:center; cursor:pointer;
    font-size:.82rem; font-weight:700; color:var(--texto-suave);
    transition: all .15s ease;
  }
  .perfilBtn .emoji { font-size:1.7rem; display:block; margin-bottom:6px; }
  .perfilBtn.activo {
    border-color:var(--azul-medio); background:var(--azul-claro); color:var(--azul-oscuro);
    box-shadow: 0 4px 10px rgba(42,82,152,.18);
  }

  /* ============================================================
     ESTADO Y BOTONES DE ACCIÓN (pantalla principal)
     ============================================================ */
  #tarjetaEstado { padding: 18px; text-align:center; }
  #estadoTexto {
    font-size:.95rem; font-weight:700; color:var(--texto-suave);
    min-height: 1.2em; margin-bottom: 4px;
  }

  .btnGrande {
    width:100%; border:none; border-radius:18px; color:#fff;
    font-size:1.08rem; font-weight:800; padding:20px;
    cursor:pointer; box-shadow: var(--sombra-suave);
    margin-top:12px;
    display:flex; align-items:center; justify-content:center; gap:10px;
    transition: transform .12s ease;
  }
  .btnGrande:active { transform: scale(.97); }
  .btnGrande:first-child { margin-top:0; }

  .btnLlamar { background:linear-gradient(135deg, var(--verde), var(--verde-fuerte)); position:relative; }
  .btnLlamar::before {
    content:""; position:absolute; inset:0; border-radius:18px;
    box-shadow: 0 0 0 0 rgba(31,168,85,.55);
    animation: anillo 2s infinite;
  }
  .btnCancelar  { background:linear-gradient(135deg, var(--rojo), var(--rojo-fuerte)); }
  .btnSumarse   { background:linear-gradient(135deg, #2266dd, #1c4fb0); }
  .btnFinalizar { background:linear-gradient(135deg, var(--rojo), var(--rojo-fuerte)); }

  @keyframes anillo {
    0%   { box-shadow: 0 0 0 0 rgba(31,168,85,.45); }
    70%  { box-shadow: 0 0 0 16px rgba(31,168,85,0); }
    100% { box-shadow: 0 0 0 0 rgba(31,168,85,0); }
  }

  .pildora-estado {
    display:inline-flex; align-items:center; gap:6px;
    font-size:.78rem; font-weight:800; padding:6px 14px;
    border-radius:50px; margin-bottom:10px;
  }
  .pildora-estado.gris   { background:#eef1f7; color:var(--texto-suave); }
  .pildora-estado.azul   { background:#e6edfb; color:var(--azul-medio); }
  .pildora-estado.verde  { background:#e5f8ed; color:var(--verde-fuerte); }
  .pildora-estado .bolita { width:8px; height:8px; border-radius:50%; background:currentColor; }
  .pildora-estado.azul .bolita { animation: parpadeo 1.1s infinite; }

  @keyframes parpadeo { 0%,100%{opacity:1;} 50%{opacity:.3;} }

  /* ============================================================
     PANTALLA GPS (dispositivo del Pedro)
     ============================================================ */
  #pantallaGPS {
    position:fixed; inset:0; z-index: 9999;
    background:linear-gradient(160deg, var(--azul-oscuro), var(--azul-medio));
    color:#fff; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center; padding:36px;
  }
  #pantallaGPS h1 { font-size:1.5rem; margin-bottom:16px; font-weight:800; }
  #pantallaGPS p { font-size:1rem; opacity:.88; line-height:1.5; }
  #estadoGPS { margin-top:26px; font-size:1.05rem; font-weight:800; }

  /* ============================================================
     PANTALLA DE LLAMADA A PANTALLA COMPLETA
     (las cámaras ocupan toda la pantalla y se ajustan solas)
     ============================================================ */
  #pantallaLlamadaEnCurso {
    position:fixed; inset:0; z-index: 2000;
    background:#0b0f1a;
    display:none;
    flex-direction:column;
  }
  #pantallaLlamadaEnCurso.activa { display:flex; }

  #videoGrid {
    flex:1; min-height:0;
    display:grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    grid-auto-rows: 1fr;
    gap:3px;
    background:#0b0f1a;
  }
  .videoBox { position:relative; background:#111725; overflow:hidden; min-height:0; }
  .videoBox video {
    width:100%; height:100%; display:block; object-fit:cover;
  }
  .videoBox .etiqueta {
    position:absolute; bottom:10px; left:12px; color:#fff;
    font-size:.8rem; font-weight:700;
    background:rgba(0,0,0,.45); backdrop-filter: blur(4px);
    padding:4px 12px; border-radius:50px;
  }

  #barraLlamadaOverlay {
    background: rgba(10,14,26,.92);
    backdrop-filter: blur(10px);
    padding: 14px 18px calc(16px + env(safe-area-inset-bottom));
    display:flex; flex-direction:column; align-items:center; gap:10px;
  }
  #estadoLlamadaOverlay { color:#fff; font-weight:800; font-size:.95rem; opacity:.92; }
  #botonesLlamadaOverlay { width:100%; max-width:420px; }
  #botonesLlamadaOverlay .btnGrande { margin-top:0; }

  /* ============================================================
     RESPONSIVE
     ============================================================ */
  @media (max-width: 380px) {
    header h1 { font-size:1.02rem; }
    .perfilBtn { font-size:.75rem; padding:12px 4px; }
    .perfilBtn .emoji { font-size:1.5rem; }
  }
</style>
</head>
<body>

<div id="pantallaGPS" style="display:none;">
  <h1>📍 Ubicación del Pedro</h1>
  <p>Esta pantalla envía su ubicación a la familia automáticamente.<br>No es necesario tocar nada más.</p>
  <div id="estadoGPS">Iniciando...</div>
</div>

<div id="appFamilia">
  <header>
    <div class="marca">
      <div class="marca-icono">👨‍👩‍👧‍👦</div>
      <div>
        <h1>Familia del Pedro</h1>
        <p class="subtitulo">Ubicación y videollamada en un solo lugar</p>
      </div>
    </div>
  </header>

  <main id="vistaPrincipal">

    <section id="tarjetaMapa" class="tarjeta">
      <div id="contenedorMapa">
        <div id="mapa" title="Toca para ver el mapa completo"></div>
        <button id="btnCerrarMapa" type="button">✕ Volver</button>
        <div id="ultimaUbicacion">
          <span id="textoHora">Buscando ubicación del Tata…</span>
          <span id="direccionTexto"></span>
        </div>
      </div>
    </section>

    <section id="tarjetaPerfil" class="tarjeta">
      <div class="tarjeta-titulo"><span class="punto">🙋</span>¿Quién está llamando?</div>
      <div class="perfiles">
  <div class="perfilBtn" data-nombre="Diego" data-emoji="👨‍💻"><img class="foto-perfil" src="fotodiego.png" alt="Diego">Diego</div>
  <div class="perfilBtn" data-nombre="Matias" data-emoji="🙋‍♂️"><img class="foto-perfil" src="tiorenechibi.jpg" alt="Matias">Matias</div>
  <div class="perfilBtn" data-nombre="María" data-emoji="👩"><img class="foto-perfil" src="mariafoto.enc" alt="María">María</div>
  <div class="perfilBtn" data-nombre="Ingrid" data-emoji="👩‍🦰"><img class="foto-perfil" src="ingridfoto.enc" alt="Ingrid">Ingrid</div>
</div>
    </section>

    <section id="tarjetaEstado" class="tarjeta">
      <div id="estadoTexto"></div>
      <div id="panelControl"></div>
    </section>

  </main>
</div>

<div id="pantallaLlamadaEnCurso">
  <div id="videoGrid"></div>
  <div id="barraLlamadaOverlay">
    <div id="estadoLlamadaOverlay"></div>
    <div id="botonesLlamadaOverlay"></div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

<script>
/* ============================================================
   CONFIGURACIÓN DE FIREBASE
   ============================================================ */
const firebaseConfig = {
  apiKey: "AIzaSyDaarm67ndNx64YwmsEqhyEE-JI3G0zYpo",
  authDomain: "pedrollamadas-f8e8c.firebaseapp.com",
  databaseURL: "https://pedrollamadas-f8e8c-default-rtdb.firebaseio.com",
  projectId: "pedrollamadas-f8e8c",
  storageBucket: "pedrollamadas-f8e8c.firebasestorage.app",
  messagingSenderId: "910857723610",
  appId: "1:910857723610:web:94ba7b9c68d9c1c7d60fe3",
  measurementId: "G-E2F40V1GZG"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const refLlamada = db.ref('llamada');
const refSala = db.ref('sala');
const refParticipantes = refSala.child('participantes');
const refPares = refSala.child('pares');

let ICE_SERVERS = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] }; // respaldo mientras carga

(async function cargarServidoresTurn(){
  try {
    const resp = await fetch('https://palmachat.metered.live/api/v1/turn/credentials?apiKey=507228bdd48481ad9e30933e1ebbf85b4f9f');
    const servidores = await resp.json();
    if (Array.isArray(servidores) && servidores.length) {
      ICE_SERVERS = { iceServers: servidores };
    }
  } catch(e) {
    console.warn('No se pudo cargar TURN de Metered, usando solo STUN de respaldo', e);
  }
})();
const MI_ID = 'fam_' + Math.random().toString(36).slice(2,10);

/* ============================================================
   VARIABLES DE ESTADO
   ============================================================ */
let perfilSeleccionado = JSON.parse(localStorage.getItem('perfilFamilia') || 'null');
let mapaLeaflet = null;
let marcadorTata = null;
let circuloPrecision = null;
let ultimaLat = null;
let ultimaLng = null;
let estadoLlamadaActual = 'inactiva';
let streamLocal = null;
let conexiones = {};
let listenersPares = {};
let enSala = false;

/* ============================================================
   MODO GPS (pedroindex.html?gps=1)
   ============================================================ */
const parametros = new URLSearchParams(window.location.search);
if (parametros.get('gps') === '1') {
  document.getElementById('appFamilia').style.display = 'none';
  document.getElementById('pantallaGPS').style.display = 'flex';
  iniciarEnvioGPS();
} else {
  iniciarAppFamiliar();
}

function iniciarEnvioGPS(){
  const estadoGPS = document.getElementById('estadoGPS');
  if (!('geolocation' in navigator)) { estadoGPS.textContent = 'Este teléfono no soporta ubicación GPS.'; return; }
  navigator.geolocation.watchPosition(
    (pos) => {
      const ahora = new Date();
      const hora = `${String(ahora.getHours()).padStart(2,'0')}:${String(ahora.getMinutes()).padStart(2,'0')} hrs`;
      const payload = {
        lat: pos.coords.latitude,
        lng: pos.coords.longitude,
        precision: pos.coords.accuracy,
        ultimaActualizacion: hora
      };
      db.ref('ubicacion_tata').set(payload);
      db.ref('ubicacion').set(payload);
      estadoGPS.textContent = `✅ Ubicación enviada (${hora})`;
    },
    (err) => { estadoGPS.textContent = '⚠️ Activa el permiso de ubicación para este sitio.'; console.warn(err); },
    { enableHighAccuracy:true, maximumAge:15000, timeout:20000 }
  );
}

/* ============================================================
   APP FAMILIAR NORMAL
   ============================================================ */
function iniciarAppFamiliar(){
  inicializarMapa();
  escucharUbicacion();
  configurarSelectorPerfil();
  escucharEstadoLlamada();
  configurarClickAgrandarMapa();
}

/* MAPA CON ZOOM CERCANO POR DEFECTO (18) */
function inicializarMapa(){
  mapaLeaflet = L.map('mapa').setView([-33.4372, -70.6506], 18);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution:'&copy; OpenStreetMap'
  }).addTo(mapaLeaflet);
}

/* ESCUCHA AMBOS NODOS PARA EVITAR DESSINCRO */
function escucharUbicacion(){
  const iconoTata = L.icon({
    iconUrl: 'fotopedro.enc', // <--- REEMPLAZA ESTO CON EL LINK DE LA FOTO DEL TATA
    iconSize: [56, 56],
    iconAnchor: [28, 28],
    popupAnchor: [0, -30],
    className: 'foto-marcador'
  });

  const procesarUbicacion = (snap) => {
    const datos = snap.val();
    if (!datos || datos.lat == null || datos.lng == null) return;

    const { lat, lng, precision, ultimaActualizacion } = datos;
    let hora = 'Reciente';
    if (typeof ultimaActualizacion === 'number') {
      hora = new Date(ultimaActualizacion).toLocaleTimeString('es-CL');
    } else if (typeof ultimaActualizacion === 'string') {
      hora = ultimaActualizacion;
    }

    if (lat !== ultimaLat || lng !== ultimaLng) {
      ultimaLat = lat;
      ultimaLng = lng;
      obtenerDireccionTexto(lat, lng);
    }

    const urlGoogleMaps = `https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}`;
    const contenidoPopup = `
      <div class="popup-maps">
        <p>👨‍🦳 Pedro está aquí</p>
        <a href="${urlGoogleMaps}" target="_blank" class="btn-maps">
          🗺️ Ir en Google Maps
        </a>
      </div>
    `;

    if (!marcadorTata) {
      marcadorTata = L.marker([lat, lng], { icon: iconoTata })
        .addTo(mapaLeaflet)
        .bindPopup(contenidoPopup);

      if (precision) {
        circuloPrecision = L.circle([lat, lng], { radius: precision, color: '#2a5298', fillColor: '#2a5298', fillOpacity: 0.15 }).addTo(mapaLeaflet);
      }
    } else {
      marcadorTata.setLatLng([lat, lng]);
      marcadorTata.setPopupContent(contenidoPopup);

      if (circuloPrecision) {
        circuloPrecision.setLatLng([lat, lng]);
        if (precision) circuloPrecision.setRadius(precision);
      }
    }

    mapaLeaflet.panTo([lat, lng]);
    document.getElementById('textoHora').textContent = `Última actualización: ${hora}`;
  };

  db.ref('ubicacion_tata').on('value', procesarUbicacion);
  db.ref('ubicacion').on('value', procesarUbicacion);
}

/* GEOCODING: Traduce Lat/Lng a calle */
function obtenerDireccionTexto(lat, lng) {
  const url = `https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lng}`;
  fetch(url)
    .then(res => res.json())
    .then(data => {
      if (data && data.display_name) {
        const partes = data.display_name.split(',');
        const direccionCorta = partes.slice(0, 3).join(',');
        document.getElementById('direccionTexto').textContent = `📍 ${direccionCorta}`;
      }
    })
    .catch(() => {
      document.getElementById('direccionTexto').textContent = `📍 Coordenadas: ${lat.toFixed(4)}, ${lng.toFixed(4)}`;
    });
}

/* PINCHAR MAPA (o el botón Volver) PARA ENTRAR/SALIR DE PANTALLA COMPLETA */
function toggleMapa(){
  document.body.classList.toggle('mapaAgrandado');
  setTimeout(() => {
    mapaLeaflet.invalidateSize();
    if (ultimaLat && ultimaLng) mapaLeaflet.panTo([ultimaLat, ultimaLng]);
  }, 320);
}

function configurarClickAgrandarMapa() {
  document.getElementById('mapa').addEventListener('click', toggleMapa);
  document.getElementById('btnCerrarMapa').addEventListener('click', (e) => {
    e.stopPropagation();
    toggleMapa();
  });
}

function configurarSelectorPerfil(){
  const botones = document.querySelectorAll('.perfilBtn');
  botones.forEach(btn => {
    if (perfilSeleccionado && btn.dataset.nombre === perfilSeleccionado.nombre) {
      btn.classList.add('activo');
    }
    btn.addEventListener('click', () => {
      botones.forEach(b => b.classList.remove('activo'));
      btn.classList.add('activo');
      perfilSeleccionado = { nombre: btn.dataset.nombre, emoji: btn.dataset.emoji, foto: btn.dataset.foto };
      localStorage.setItem('perfilFamilia', JSON.stringify(perfilSeleccionado));

      const btnLlamar = document.querySelector('.btnLlamar');
      if (btnLlamar) btnLlamar.style.display = 'flex';
    });
  });
}

/* ============================================================
   ESTADO DE LA LLAMADA: pantalla principal + pantalla completa
   ============================================================ */
function escucharEstadoLlamada(){
  refLlamada.on('value', (snap) => {
    const datos = snap.val() || { estado:'inactiva' };
    estadoLlamadaActual = datos.estado || 'inactiva';
    renderizarPanel(datos);
    actualizarOverlayLlamada();
    actualizarVisibilidadPantallas();
    if (estadoLlamadaActual === 'inactiva' && enSala) salirDeLlamada();
  });
}

/* Muestra/oculta la pantalla de llamada a pantalla completa según si
   YO estoy en la sala (enSala), no según el estado global de Firebase:
   así cada quien ve la pantalla completa solo cuando de verdad está
   adentro de la videollamada. */
function actualizarVisibilidadPantallas(){
  const overlay = document.getElementById('pantallaLlamadaEnCurso');
  overlay.classList.toggle('activa', enSala);
}

function actualizarOverlayLlamada(){
  const estadoOverlay = document.getElementById('estadoLlamadaOverlay');
  const botones = document.getElementById('botonesLlamadaOverlay');
  botones.innerHTML = '';

  if (estadoLlamadaActual === 'llamando') {
    estadoOverlay.textContent = '📞 Llamando al Tata…';
    botones.appendChild(crearBoton('btnCancelar', '✖ Cancelar llamada', finalizarLlamada));
  } else if (estadoLlamadaActual === 'en_llamada') {
    estadoOverlay.textContent = '🟢 En videollamada';
    botones.appendChild(crearBoton('btnFinalizar', '🔴 Colgar', colgarLlamada));
  }
}

function renderizarPanel(datos){
  const panel = document.getElementById('panelControl');
  const estadoTexto = document.getElementById('estadoTexto');
  panel.innerHTML = '';
  estadoTexto.innerHTML = '';

  if (estadoLlamadaActual === 'inactiva') {
    const btn = crearBoton('btnLlamar', '📞 Llamar al Pedro', llamarTata);
    if (perfilSeleccionado) btn.style.display = 'flex';
    panel.appendChild(btn);
  }
  else if (estadoLlamadaActual === 'llamando') {
    estadoTexto.appendChild(pildora('azul', `Llamando… (${datos.llamadorNombre || ''})`));
    if (!enSala) panel.appendChild(crearBoton('btnCancelar', '✖ Cancelar llamada', finalizarLlamada));
  }
  else if (estadoLlamadaActual === 'en_llamada') {
    estadoTexto.appendChild(pildora('verde', 'El Pedro está en llamada'));
    if (!enSala) panel.appendChild(crearBoton('btnSumarse', '➕ Sumarse a la llamada', sumarseALlamada));
  }
}

function pildora(color, texto){
  const p = document.createElement('div');
  p.className = `pildora-estado ${color}`;
  p.innerHTML = `<span class="bolita"></span>${texto}`;
  return p;
}

function crearBoton(clase, texto, accion){
  const b = document.createElement('button');
  b.className = `btnGrande ${clase}`;
  b.textContent = texto;
  b.addEventListener('click', accion);
  return b;
}

/* ---------- ACCIONES ---------- */
function llamarTata(){
  if (!perfilSeleccionado) { alert('Por favor elige primero quién está llamando 🙂'); return; }
  refLlamada.set({
    estado:'llamando',
    llamadorNombre: perfilSeleccionado.nombre,
    llamadorFoto: perfilSeleccionado.emoji,
    llamadorFotoUrl: perfilSeleccionado.foto || ''
  });
  unirseALlamada();
}

function sumarseALlamada(){ unirseALlamada(); }

/* Cancela una llamada que TODAVÍA no ha sido contestada por nadie
   (nadie más alcanzó a sumarse). Siempre termina para todos, porque
   en ese punto nadie más está conectado. */
function finalizarLlamada(){
  refLlamada.set({ estado:'inactiva', llamadorNombre:'', llamadorFoto:'' });
  refSala.remove();
  salirDeLlamada();
}

/* Colgar durante una llamada YA EN CURSO (posiblemente con varias
   personas adentro). Regla pedida por la familia:
   - Si en este momento hay MÁS de 2 personas en la sala (el Pedro +
     2 o más familiares), al colgar solo me desconecto yo; el resto
     sigue en la llamada tranquilamente.
   - Si en este momento solo quedan 2 personas (el Pedro y yo), al
     colgar se corta la llamada para ambos. */
async function colgarLlamada(){
  try {
    const snap = await refParticipantes.once('value');
    const cantidadActual = snap.numChildren();
    if (cantidadActual <= 2) {
      // Solo estábamos el Pedro y yo: se corta la llamada para los dos
      refLlamada.set({ estado:'inactiva', llamadorNombre:'', llamadorFoto:'' });
      refSala.remove();
    }
    // Si éramos 3 o más, no tocamos refLlamada ni refSala:
    // el resto de la familia y el Pedro quedan conectados igual.
  } catch (e) {
    // Si por algún motivo no se pudo leer la cantidad de participantes,
    // no arriesgamos cortar la llamada de los demás: solo nos vamos nosotros.
  }
  salirDeLlamada();
}

/* ============================================================
   WEBRTC + FIREBASE (mesh, sin librerías externas)
   ============================================================ */
async function unirseALlamada(){
  if (enSala) return;
  enSala = true;
  actualizarVisibilidadPantallas();
  actualizarOverlayLlamada();
  try {
    streamLocal = await navigator.mediaDevices.getUserMedia({ video:true, audio:true });
  } catch(e){
    try { streamLocal = await navigator.mediaDevices.getUserMedia({ audio:true }); }
    catch(e2){
      alert('No se pudo acceder a la cámara ni al micrófono.');
      enSala = false;
      actualizarVisibilidadPantallas();
      return;
    }
  }
  agregarCajaVideo('local', streamLocal, perfilSeleccionado ? perfilSeleccionado.nombre : 'Tú', true);

  const miRef = refParticipantes.child(MI_ID);
  miRef.set({ nombre: perfilSeleccionado ? perfilSeleccionado.nombre : 'Familiar' });
  miRef.onDisconnect().remove();

  refParticipantes.on('child_added', (snap) => {
    const otroId = snap.key;
    if (otroId === MI_ID || conexiones[otroId]) return;
    conectarConPeer(otroId, (snap.val() || {}).nombre || 'Familiar');
  });
  refParticipantes.on('child_removed', (snap) => cerrarConexionPeer(snap.key));
}

function agregarCajaVideo(id, stream, nombre, esLocal){
  let box = document.getElementById('caja_' + id);
  if (!box) {
    box = document.createElement('div');
    box.className = 'videoBox';
    box.id = 'caja_' + id;
    box.innerHTML = `<video id="video_${id}" autoplay playsinline ${esLocal ? 'muted' : ''}></video><div class="etiqueta">${nombre}</div>`;
    document.getElementById('videoGrid').appendChild(box);
  }
  document.getElementById('video_' + id).srcObject = stream;
}

function conectarConPeer(otroId, nombreOtro){
  const pairKey = [MI_ID, otroId].sort().join('__');
  const soyA = MI_ID < otroId;
  const pc = new RTCPeerConnection(ICE_SERVERS);
  conexiones[otroId] = pc;
  listenersPares[otroId] = [];

  streamLocal.getTracks().forEach(track => pc.addTrack(track, streamLocal));

  pc.ontrack = (event) => agregarCajaVideo(otroId, event.streams[0], nombreOtro, false);

  const refCandPropio = refPares.child(pairKey).child(soyA ? 'candidatosA' : 'candidatosB');
  pc.onicecandidate = (event) => { if (event.candidate) refCandPropio.push(event.candidate.toJSON()); };

  if (soyA) {
    pc.createOffer().then(offer => {
      pc.setLocalDescription(offer);
      refPares.child(pairKey).child('oferta').set({ type:offer.type, sdp:offer.sdp });
    });
    const refRespuesta = refPares.child(pairKey).child('respuesta');
    const cbRespuesta = refRespuesta.on('value', (snap) => {
      const val = snap.val();
      if (val && !pc.currentRemoteDescription) pc.setRemoteDescription(new RTCSessionDescription(val));
    });
    listenersPares[otroId].push([refRespuesta, cbRespuesta]);

    const refCandB = refPares.child(pairKey).child('candidatosB');
    const cbCandB = refCandB.on('child_added', (snap) => pc.addIceCandidate(new RTCIceCandidate(snap.val())).catch(()=>{}));
    listenersPares[otroId].push([refCandB, cbCandB]);
  } else {
    const refOferta = refPares.child(pairKey).child('oferta');
    const cbOferta = refOferta.on('value', async (snap) => {
      const val = snap.val();
      if (val && !pc.currentRemoteDescription) {
        await pc.setRemoteDescription(new RTCSessionDescription(val));
        const answer = await pc.createAnswer();
        await pc.setLocalDescription(answer);
        refPares.child(pairKey).child('respuesta').set({ type:answer.type, sdp:answer.sdp });
      }
    });
    listenersPares[otroId].push([refOferta, cbOferta]);

    const refCandA = refPares.child(pairKey).child('candidatosA');
    const cbCandA = refCandA.on('child_added', (snap) => pc.addIceCandidate(new RTCIceCandidate(snap.val())).catch(()=>{}));
    listenersPares[otroId].push([refCandA, cbCandA]);
  }
}

function cerrarConexionPeer(otroId){
  const pc = conexiones[otroId];
  if (pc) { pc.close(); delete conexiones[otroId]; }
  (listenersPares[otroId] || []).forEach(([ref, cb]) => ref.off('value', cb));
  delete listenersPares[otroId];
  const box = document.getElementById('caja_' + otroId);
  if (box) box.remove();
}

function salirDeLlamada(){
  if (!enSala) return;
  enSala = false;
  actualizarVisibilidadPantallas();
  refParticipantes.off('child_added');
  refParticipantes.off('child_removed');
  Object.keys(conexiones).forEach(cerrarConexionPeer);
  conexiones = {}; listenersPares = {};
  if (streamLocal) { streamLocal.getTracks().forEach(t => t.stop()); streamLocal = null; }
  refParticipantes.child(MI_ID).remove();
  document.getElementById('videoGrid').innerHTML = '';
}
