<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Llamar al PEDRO - Familia</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root {
    --bg-app: #0c1017;
    --surface: #161b22;
    --surface-glass: rgba(22, 27, 34, 0.85);
    --primary: #3b82f6;
    --primary-gradient: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
    --success: #10b981;
    --success-gradient: linear-gradient(135deg, #10b981 0%, #059669 100%);
    --danger: #ef4444;
    --danger-gradient: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
    --text-main: #f3f4f6;
    --text-muted: #9ca3af;
    --border: rgba(255, 255, 255, 0.08);
    --radius-lg: 24px;
    --radius-md: 16px;
    --radius-sm: 12px;
    --shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
  }

  * { margin:0; padding:0; box-sizing:border-box; font-family:'SF Pro Display', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
  body { background: var(--bg-app); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; }

  header { 
    background: var(--surface-glass); 
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--border);
    padding: 16px 20px; 
    text-align: center; 
    position: sticky;
    top: 0;
    z-index: 50;
  }
  header h1 { font-size: 1rem; font-weight: 600; color: var(--text-main); letter-spacing: 0.02em; display: flex; align-items: center; justify-content: center; gap: 8px; }

  #appContainer {
    display: flex;
    flex-direction: column;
    gap: 16px;
    padding: 20px 16px;
    max-width: 480px;
    margin: 0 auto;
    width: 100%;
    flex-grow: 1;
  }

  #selectorPerfil { 
    background: var(--surface); 
    padding: 20px; 
    border-radius: var(--radius-lg); 
    border: 1px solid var(--border);
    box-shadow: var(--shadow); 
    animation: fadeIn 0.4s ease;
  }
  #selectorPerfil h2 { font-size: 0.8rem; font-weight: 600; margin-bottom: 14px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.1em; text-align: center; }
  .perfiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  
  .perfilBtn { 
    border: 1px solid var(--border); 
    background: rgba(255, 255, 255, 0.02); 
    border-radius: var(--radius-sm); 
    padding: 10px 4px; 
    text-align: center; 
    cursor: pointer; 
    font-size: 0.75rem; 
    font-weight: 500;
    color: var(--text-muted);
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  }
  
  /* Estilo para las fotos de perfil circulares */
  .perfilBtn img { 
    width: 48px; 
    height: 48px; 
    border-radius: 50%; 
    object-fit: cover; 
    display: block; 
    margin: 0 auto 6px auto; 
    border: 2px solid var(--border);
    transition: transform 0.2s, border-color 0.2s; 
  }
  
  .perfilBtn:hover { border-color: var(--primary); color: var(--text-main); background: rgba(59, 130, 246, 0.05); }
  .perfilBtn:hover img { transform: scale(1.08); border-color: var(--primary); }
  .perfilBtn.activo { border-color: var(--primary); background: rgba(59, 130, 246, 0.15); color: var(--text-main); font-weight: 600; box-shadow: 0 0 20px rgba(59, 130, 246, 0.2); }
  .perfilBtn.activo img { border-color: var(--primary); }

  #panelControl { width: 100%; }
  
  .btnGrande { 
    width: 100%; 
    border: none; 
    border-radius: var(--radius-lg); 
    color: #fff; 
    font-size: 1rem; 
    font-weight: 600; 
    padding: 18px 24px; 
    cursor: pointer; 
    box-shadow: var(--shadow); 
    text-align: center; 
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .btnGrande:active { transform: scale(0.97); }
  
  .btnLlamar   { background: var(--success-gradient); display: none; animation: pulseGlow 2s infinite; }
  .btnCancelar { background: var(--danger-gradient); }
  .btnSumarse  { background: var(--primary-gradient); }
  .btnFinalizar{ 
    background: var(--danger-gradient); 
    font-size: 1.1rem; 
    padding: 16px 32px; 
    border-radius: 40px; 
    width: auto; 
    min-width: 220px; 
    box-shadow: 0 10px 25px rgba(239, 68, 68, 0.5); 
    letter-spacing: 0.02em;
  }

  #estadoTexto { text-align: center; font-size: 0.85rem; font-weight: 500; color: var(--text-muted); min-height: 20px; }

  #seccionMapa { 
    background: var(--surface); 
    border-radius: var(--radius-lg); 
    overflow: hidden; 
    border: 1px solid var(--border);
    box-shadow: var(--shadow); 
  }
  #mapa { width: 100%; height: 240px; z-index: 1; }
  #ultimaUbicacion {
    text-align: center; padding: 14px; font-size: 0.75rem; color: var(--text-muted); background: var(--surface);
    border-top: 1px solid var(--border); font-weight: 500;
  }
  #direccionTexto { display: block; font-size: 0.8rem; font-weight: 600; color: var(--text-main); margin-top: 3px; }

  #videoGrid {
    display: none;
    position: fixed;
    inset: 0;
    background: #07090e;
    z-index: 9999;
    padding: 20px;
    gap: 16px;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    align-content: center;
    justify-content: center;
  }
  body.en-videollamada #videoGrid { display: grid; animation: fadeIn 0.3s ease; }
  body.en-videollamada #appContainer { display: none; }

  .videoBox {
    position: relative;
    background: #111827;
    border-radius: var(--radius-lg);
    overflow: hidden;
    width: 100%;
    height: 100%;
    min-height: 280px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid var(--border);
    box-shadow: 0 20px 40px rgba(0,0,0,0.6);
  }
  .videoBox video { width: 100%; height: 100%; object-fit: cover; }
  .videoBox .etiqueta { 
    position: absolute; bottom: 14px; left: 14px; color: #fff; font-size: 0.85rem; 
    background: rgba(0, 0, 0, 0.65); backdrop-filter: blur(8px); padding: 6px 14px; border-radius: var(--radius-sm); font-weight: 600;
    border: 1px solid rgba(255,255,255,0.1);
  }

  #controlesVideollamada {
    position: fixed;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 10000;
    display: none;
    justify-content: center;
    width: 100%;
  }
  body.en-videollamada #controlesVideollamada { display: flex; }

  #pantallaGPS { 
    position: fixed; inset: 0; background: var(--bg-app); color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 32px; z-index: 9999; 
  }
  #pantallaGPS h1 { font-size: 1.5rem; font-weight: 600; margin-bottom: 12px; }
  #pantallaGPS p { font-size: 0.9rem; color: var(--text-muted); line-height: 1.5; max-width: 360px; }
  #estadoGPS { margin-top: 24px; font-size: 0.85rem; font-weight: 500; background: var(--surface); border: 1px solid var(--border); padding: 10px 20px; border-radius: var(--radius-md); box-shadow: var(--shadow); }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes pulseGlow {
    0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4); }
    70% { box-shadow: 0 0 0 15px rgba(16, 185, 129, 0); }
    100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
  }

  .foto-marcador {
    border-radius: 50%;
    border: 2px solid var(--primary);
    background-color: var(--surface);
    object-fit: cover;
    box-shadow: var(--shadow);
  }
  .leaflet-popup-content-wrapper, .leaflet-popup-tip {
    background: var(--surface) !important;
    color: var(--text-main) !important;
    border-radius: var(--radius-sm) !important;
    border: 1px solid var(--border);
    box-shadow: var(--shadow) !important;
  }
  .popup-maps { text-align: center; font-family: inherit; }
  .popup-maps p { margin-bottom: 8px; font-weight: 600; font-size: 12px; color: var(--text-main); }
  .popup-maps .btn-maps {
    background: var(--success-gradient); color: white; text-decoration: none; padding: 6px 12px;
    border-radius: 8px; display: inline-block; font-weight: 600; font-size: 11px;
    box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
  }
</style>
</head>
<body>

<div id="pantallaGPS" style="display:none;">
  <h1>📍 Ubicación del PEDRO</h1>
  <p>Transmitiendo ubicación en segundo plano de manera segura para la tranquilidad familiar.</p>
  <div id="estadoGPS">Iniciando sistema GPS...</div>
</div>

<div id="appContainer">
  <header><h1>📞 Familia del PEDRO</h1></header>

  <!-- Selector de perfil con fotos reales -->
  <div id="selectorPerfil">
    <h2>¿Quién está llamando?</h2>
    <div class="perfiles">
      <div class="perfilBtn" data-nombre="Diego" data-foto="fotodiego.png">
        <img src="fotodiego.png" alt="Diego">Diego
      </div>
      <div class="perfilBtn" data-nombre="Matias" data-foto="matiasfoto.enc">
        <img src="matiasfoto.enc" alt="Matias">Matias
      </div>
      <div class="perfilBtn" data-nombre="María" data-foto="mariafoto.enc">
        <img src="mariafoto.enc" alt="María">María
      </div>
      <div class="perfilBtn" data-nombre="Ingrid" data-foto="ingridfoto.enc">
        <img src="ingridfoto.enc" alt="Ingrid">Ingrid
      </div>
    </div>
  </div>

  <div id="estadoTexto"></div>
  <div id="panelControl"></div>

  <div id="seccionMapa">
    <div id="mapa"></div>
    <div id="ultimaUbicacion">
      <span id="textoHora">Buscando ubicación del PEDRO...</span>
      <span id="direccionTexto"></span>
    </div>
  </div>
</div>

<div id="videoGrid"></div>
<div id="controlesVideollamada"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDaarm67ndNx64YwmsEqhyEE-JI3G0zYpo",
  authDomain: "pedrollamadas-f8e8c.firebaseapp.com",
  databaseURL: "https://pedrollamadas-f8e8c-default-rtdb.firebaseio.com",
  projectId: "pedrollamadas-f8e8c",
  storageBucket: "pedrollamadas-f8e8c.firebasestorage.app",
  messagingSenderId: "910857723610",
  appId: "1:910857723610:web:94ba7b9c68d9c1c7d60fe3",
  measurementId: "G-E2F40V1GZG"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const refLlamada = db.ref('llamada');
const refSala = db.ref('sala');
const refParticipantes = refSala.child('participantes');
const refPares = refSala.child('pares');

const ICE_SERVERS = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };
const MI_ID = 'fam_' + Math.random().toString(36).slice(2,10);

let perfilSeleccionado = JSON.parse(localStorage.getItem('perfilFamilia') || 'null');
let mapaLeaflet = null;
let marcadorTata = null;
let circuloPrecision = null;
let ultimaLat = null;
let ultimaLng = null;
let estadoLlamadaActual = 'inactiva';
let streamLocal = null;
let conexiones = {};
let listenersPares = {};
let enSala = false;

const parametros = new URLSearchParams(window.location.search);
if (parametros.get('gps') === '1') {
  document.getElementById('appContainer').style.display = 'none';
  document.getElementById('pantallaGPS').style.display = 'flex';
  iniciarEnvioGPS();
} else {
  iniciarAppFamiliar();
}

function iniciarEnvioGPS(){
  const estadoGPS = document.getElementById('estadoGPS');
  if (!('geolocation' in navigator)) { estadoGPS.textContent = 'GPS no soportado.'; return; }
  navigator.geolocation.watchPosition(
    (pos) => {
      const ahora = new Date();
      const hora = `${String(ahora.getHours()).padStart(2,'0')}:${String(ahora.getMinutes()).padStart(2,'0')} hrs`;
      const payload = { lat: pos.coords.latitude, lng: pos.coords.longitude, precision: pos.coords.accuracy, ultimaActualizacion: hora };
      db.ref('ubicacion_tata').set(payload);
      db.ref('ubicacion').set(payload);
      estadoGPS.textContent = `✅ Transmitiendo señal (${hora})`;
    },
    (err) => { estadoGPS.textContent = '⚠️ Active el permiso de ubicación.'; },
    { enableHighAccuracy:true, maximumAge:15000, timeout:20000 }
  );
}

function iniciarAppFamiliar(){
  inicializarMapa();
  escucharUbicacion();
  configurarSelectorPerfil();
  escucharEstadoLlamada();
}

function inicializarMapa(){
  mapaLeaflet = L.map('mapa', { zoomControl: false }).setView([-33.4372, -70.6506], 17);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution:'&copy; OpenStreetMap' }).addTo(mapaLeaflet);
}

function escucharUbicacion(){
  const iconoTata = L.icon({
    iconUrl: 'https://i.ibb.co/68Z7442/tata-avatar.png',
    iconSize: [44, 44], iconAnchor: [22, 22], popupAnchor: [0, -24], className: 'foto-marcador'
  });

  const procesarUbicacion = (snap) => {
    const datos = snap.val();
    if (!datos || datos.lat == null || datos.lng == null) return;
    const { lat, lng, precision, ultimaActualizacion } = datos;
    let hora = typeof ultimaActualizacion === 'string' ? ultimaActualizacion : 'Reciente';

    if (lat !== ultimaLat || lng !== ultimaLng) {
      ultimaLat = lat; ultimaLng = lng;
      obtenerDireccionTexto(lat, lng);
    }
    
    const urlMaps = `https://www.google.com/maps/dir/?api=1&destination=${lat},${lng}`;
    const popupHtml = `<div class="popup-maps"><p>👨‍🦳 PEDRO está aquí</p><a href="${urlMaps}" target="_blank" class="btn-maps">🗺️ Abrir Maps</a></div>`;

    if (!marcadorTata) {
      marcadorTata = L.marker([lat, lng], { icon: iconoTata }).addTo(mapaLeaflet).bindPopup(popupHtml);
      if (precision) circuloPrecision = L.circle([lat, lng], { radius: precision, color: '#3b82f6', fillColor: '#60a5fa', fillOpacity: 0.15 }).addTo(mapaLeaflet);
    } else {
      marcadorTata.setLatLng([lat, lng]);
      marcadorTata.setPopupContent(popupHtml);
      if (circuloPrecision) { circuloPrecision.setLatLng([lat, lng]); if (precision) circuloPrecision.setRadius(precision); }
    }
    mapaLeaflet.panTo([lat, lng]);
    document.getElementById('textoHora').textContent = `Actualizado: ${hora}`;
  };

  db.ref('ubicacion_tata').on('value', procesarUbicacion);
  db.ref('ubicacion').on('value', procesarUbicacion);
}

function obtenerDireccionTexto(lat, lng) {
  fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${lat}&lon=${lng}`)
    .then(res => res.json())
    .then(data => {
      if (data && data.display_name) {
        document.getElementById('direccionTexto').textContent = `📍 ${data.display_name.split(',').slice(0, 3).join(',')}`;
      }
    }).catch(() => {});
}

function configurarSelectorPerfil(){
  const botones = document.querySelectorAll('.perfilBtn');
  botones.forEach(btn => {
    if (perfilSeleccionado && btn.dataset.nombre === perfilSeleccionado.nombre) btn.classList.add('activo');
    btn.addEventListener('click', () => {
      botones.forEach(b => b.classList.remove('activo'));
      btn.classList.add('activo');
      perfilSeleccionado = { nombre: btn.dataset.nombre, foto: btn.dataset.foto };
      localStorage.setItem('perfilFamilia', JSON.stringify(perfilSeleccionado));
      const btnLlamar = document.querySelector('.btnLlamar');
      if (btnLlamar) btnLlamar.style.display = 'flex';
    });
  });
}

function escucharEstadoLlamada(){
  refLlamada.on('value', (snap) => {
    const datos = snap.val() || { estado:'inactiva' };
    estadoLlamadaActual = datos.estado || 'inactiva';
    renderizarPanel(datos);
    if (estadoLlamadaActual === 'inactiva' && enSala) {
      salirDeLlamada();
    }
  });
}

function renderizarPanel(datos){
  const panel = document.getElementById('panelControl');
  const estadoTexto = document.getElementById('estadoTexto');
  const controlesVideo = document.getElementById('controlesVideollamada');
  panel.innerHTML = '';
  controlesVideo.innerHTML = '';

  if (estadoLlamadaActual === 'inactiva') {
    estadoTexto.textContent = '';
    const btn = crearBoton('btnLlamar', '📞 LLAMAR AL PEDRO', llamarTata);
    if (perfilSeleccionado) btn.style.display = 'flex';
    panel.appendChild(btn);
  }
  else if (estadoLlamadaActual === 'llamando') {
    estadoTexto.textContent = `Llamando al equipo... (${datos.llamadorNombre || ''})`;
    panel.appendChild(crearBoton('btnCancelar', '✖ CANCELAR LLAMADA', finalizarLlamadaParaTodos));
  }
  else if (estadoLlamadaActual === 'en_llamada') {
    estadoTexto.textContent = '🟢 El PEDRO está en llamada';
    if (!enSala) panel.appendChild(crearBoton('btnSumarse', '➕ SUMARSE A LA LLAMADA', sumarseALlamada));
    controlesVideo.appendChild(crearBoton('btnFinalizar', '🔴 COLGAR LLAMADA', salirDeLlamadaIndividual));
  }
}

function crearBoton(clase, texto, accion){
  const b = document.createElement('button');
  b.className = `btnGrande ${clase}`;
  b.textContent = texto;
  b.addEventListener('click', accion);
  return b;
}

function llamarTata(){
  if (!perfilSeleccionado) { alert('Selecciona quién está llamando primero 🙂'); return; }
  refLlamada.set({ estado:'llamando', llamadorNombre: perfilSeleccionado.nombre, llamadorFoto: perfilSeleccionado.foto });
  unirseALlamada();
}

function sumarseALlamada(){ unirseALlamada(); }

function finalizarLlamadaParaTodos(){
  refLlamada.set({ estado:'inactiva', llamadorNombre:'', llamadorFoto:'' });
  refSala.remove();
  salirDeLlamada();
}

async function salirDeLlamadaIndividual(){
  salirDeLlamada();
  const snap = await refParticipantes.once('value');
  if (!snap.exists() || snap.numChildren() === 0) {
    refLlamada.set({ estado:'inactiva', llamadorNombre:'', llamadorFoto:'' });
    refSala.remove();
  }
}

async function unirseALlamada(){
  if (enSala) return;
  enSala = true;
  document.body.classList.add('en-videollamada');

  try {
    streamLocal = await navigator.mediaDevices.getUserMedia({ video:true, audio:true });
  } catch(e){
    try { streamLocal = await navigator.mediaDevices.getUserMedia({ audio:true }); }
    catch(e2){ alert('Sin acceso a cámara ni micrófono.'); enSala = false; document.body.classList.remove('en-videollamada'); return; }
  }
  agregarCajaVideo('local', streamLocal, perfilSeleccionado ? perfilSeleccionado.nombre : 'Tú', true);

  const miRef = refParticipantes.child(MI_ID);
  miRef.set({ nombre: perfilSeleccionado ? perfilSeleccionado.nombre : 'Familiar' });
  miRef.onDisconnect().remove();

  refParticipantes.on('child_added', (snap) => {
    const otroId = snap.key;
    if (otroId === MI_ID || conexiones[otroId]) return;
    conectarConPeer(otroId, (snap.val() || {}).nombre || 'Familiar');
  });

  refParticipantes.on('child_removed', (snap) => {
    cerrarConexionPeer(snap.key);
    verificarAutoCierre();
  });
}

async function verificarAutoCierre() {
  if (!enSala) return;
  const snap = await refParticipantes.once('value');
  if (snap.exists() && snap.numChildren() <= 1) {
    finalizarLlamadaParaTodos();
  }
}

function agregarCajaVideo(id, stream, nombre, esLocal){
  let box = document.getElementById('caja_' + id);
  if (!box) {
    box = document.createElement('div');
    box.className = 'videoBox';
    box.id = 'caja_' + id;
    box.innerHTML = `<video id="video_${id}" autoplay playsinline ${esLocal ? 'muted' : ''}></video><div class="etiqueta">${nombre}</div>`;
    document.getElementById('videoGrid').appendChild(box);
  }
  document.getElementById('video_' + id).srcObject = stream;
}

function conectarConPeer(otroId, nombreOtro){
  const pairKey = [MI_ID, otroId].sort().join('__');
  const soyA = MI_ID < otroId;
  const pc = new RTCPeerConnection(ICE_SERVERS);
  conexiones[otroId] = pc;
  listenersPares[otroId] = [];

  streamLocal.getTracks().forEach(track => pc.addTrack(track, streamLocal));
  pc.ontrack = (event) => agregarCajaVideo(otroId, event.streams[0], nombreOtro, false);

  const refCandPropio = refPares.child(pairKey).child(soyA ? 'candidatosA' : 'candidatosB');
  pc.onicecandidate = (event) => { if (event.candidate) refCandPropio.push(event.candidate.toJSON()); };

  if (soyA) {
    pc.createOffer().then(offer => {
      pc.setLocalDescription(offer);
      refPares.child(pairKey).child('oferta').set({ type:offer.type, sdp:offer.sdp });
    });
    const refRespuesta = refPares.child(pairKey).child('respuesta');
    const cbRespuesta = refRespuesta.on('value', (snap) => {
      const val = snap.val();
      if (val && !pc.currentRemoteDescription) pc.setRemoteDescription(new RTCSessionDescription(val));
    });
    listenersPares[otroId].push([refRespuesta, cbRespuesta]);

    const refCandB = refPares.child(pairKey).child('candidatosB');
    const cbCandB = refCandB.on('child_added', (snap) => pc.addIceCandidate(new RTCIceCandidate(snap.val())).catch(()=>{}));
    listenersPares[otroId].push([refCandB, cbCandB]);
  } else {
    const refOferta = refPares.child(pairKey).child('oferta');
    const cbOferta = refOferta.on('value', async (snap) => {
      const val = snap.val();
      if (val && !pc.currentRemoteDescription) {
        await pc.setRemoteDescription(new RTCSessionDescription(val));
        const answer = await pc.createAnswer();
        await pc.setLocalDescription(answer);
        refPares.child(pairKey).child('respuesta').set({ type:answer.type, sdp:answer.sdp });
      }
    });
    listenersPares[otroId].push([refOferta, cbOferta]);

    const refCandA = refPares.child(pairKey).child('candidatosA');
    const cbCandA = refCandA.on('child_added', (snap) => pc.addIceCandidate(new RTCIceCandidate(snap.val())).catch(()=>{}));
    listenersPares[otroId].push([refCandA, cbCandA]);
  }
}

function cerrarConexionPeer(otroId){
  const pc = conexiones[otroId];
  if (pc) { pc.close(); delete conexiones[otroId]; }
  (listenersPares[otroId] || []).forEach(([ref, cb]) => ref.off('value', cb));
  delete listenersPares[otroId];
  const box = document.getElementById('caja_' + otroId);
  if (box) box.remove();
}

function salirDeLlamada(){
  if (!enSala) return;
  enSala = false;
  document.body.classList.remove('en-videollamada');
  refParticipantes.off('child_added');
  refParticipantes.off('child_removed');
  Object.keys(conexiones).forEach(cerrarConexionPeer);
  conexiones = {}; listenersPares = {};
  if (streamLocal) { streamLocal.getTracks().forEach(t => t.stop()); streamLocal = null; }
  refParticipantes.child(MI_ID).remove();
  document.getElementById('videoGrid').innerHTML = '';
}
</script>
