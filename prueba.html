<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Prueba | Notificaciones Globales</title>
    <style>
      body { background: #111; color: #eee; font-family: system-ui, sans-serif; }
      .container { max-width: 720px; margin: 40px auto; padding: 24px; border: 1px solid #333; border-radius: 12px; background: #1b1b1b; }
      h1 { margin-top: 0; color: #ffde59; }
      button { padding: 10px 16px; border-radius: 8px; border: 2px solid #ffde59; background: #000; color: #ffde59; cursor: pointer; font-weight: 600; }
      button:hover { filter: brightness(1.2); }
      .hint { color: #aaa; font-size: 14px; margin-top: 12px; }
      .log { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; font-size: 13px; color: #9cd3ff; margin-top: 12px; white-space: pre-wrap; }
    </style>
    <!-- SDK de Firebase (compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-messaging-compat.js"></script>
  </head>
  <body>
    <div class="container">
      <h1>Prueba de Notificaciones Globales</h1>
      <p>Esta página envía y recibe notificaciones usando un canal compartido en Firebase.</p>
      <div style="display:flex; gap:12px; align-items:center; flex-wrap: wrap;">
        <button id="btnActivarSonido" title="Habilita sonido local al recibir notificaciones">Activar sonido personalizado</button>
        <button id="btnProbarSonido" title="Reproduce el sonido para comprobar">Probar sonido</button>
        <button id="btnActivarPush" title="Guardar token FCM para push real">Activar push (FCM)</button>
        <input id="deviceNameInput" type="text" placeholder="Nombre del dispositivo" style="padding:8px; border-radius:8px; border:1px solid #444; background:#000; color:#fff;" />
        <button id="btnRegistrarDispositivo" title="Registrar este dispositivo para envío dirigido">Registrar dispositivo</button>
        <select id="deviceSelector" style="padding:8px; border-radius:8px; border:1px solid #444; background:#000; color:#ffde59; min-width:220px;">
          <option value="all">Todos los dispositivos</option>
        </select>
        <button id="btnNotificarPrueba">Notificar (Prueba)</button>
      </div>
      <div id="deviceList" style="margin-top:12px; display:flex; flex-direction:column; gap:8px;"></div>
      <p class="hint">Abre esta página en dos navegadores o dispositivos. Pulsa el botón para que ambos reciban la notificación.</p>
      <div id="logs" class="log"></div>
    </div>

    <script>
      const logsEl = document.getElementById('logs');
      const deviceListEl = document.getElementById('deviceList');
      const log = (msg) => { console.log(msg); logsEl.textContent += `\n${msg}`; };

      // Reaccionar a mensajes del Service Worker (por ejemplo, clic en notificación)
      if (navigator.serviceWorker) {
        navigator.serviceWorker.addEventListener('message', (event) => {
          const data = event && event.data;
          if (data && data.type === 'PLAY_SOUND') {
            playBeep();
            log('[SW] Mensaje recibido: reproducir sonido');
          }
        });
      }

      // Registrar el Service Worker (para mostrar notificaciones de forma fiable)
      async function registerSWWithFallback() {
        if (!('serviceWorker' in navigator)) {
          log('[SW] No soportado en este navegador');
          return;
        }
        try {
          // Ruta esperada en producción (Netlify/Vite: public => raíz)
          await navigator.serviceWorker.register('/firebase-messaging-sw.js', { scope: '/' });
          log('[SW] Registrado en /firebase-messaging-sw.js');
        } catch (e1) {
          log(`[SW] Falló registro raíz, probando /public/firebase-messaging-sw.js: ${e1 && e1.message ? e1.message : e1}`);
          try {
            await navigator.serviceWorker.register('/public/firebase-messaging-sw.js', { scope: '/' });
            log('[SW] Registrado en /public/firebase-messaging-sw.js');
          } catch (e2) {
            log(`[SW] Falló /public/, probando relativo firebase-messaging-sw.js: ${e2 && e2.message ? e2.message : e2}`);
            try {
              await navigator.serviceWorker.register('firebase-messaging-sw.js', { scope: '/' });
              log('[SW] Registrado en firebase-messaging-sw.js (relativo)');
            } catch (e3) {
              log(`[SW] Error al registrar (todas las rutas): ${e3 && e3.message ? e3.message : e3}`);
            }
          }
        }
        try {
          await navigator.serviceWorker.ready;
          log('[SW] Listo');
        } catch (err) {
          log(`[SW] Error en ready: ${err && err.message ? err.message : err}`);
        }
        if (!window.isSecureContext) {
          log('[SW] Advertencia: origen sin HTTPS. En móviles, las notificaciones requieren HTTPS.');
        }
      }
      registerSWWithFallback();
      

      // Inicializar Firebase
      const firebaseConfig = {
        apiKey: "AIzaSyDGKaUNwsZcbR-ZiX7EFaIe-GNJuMU4J1Y",
        authDomain: "comedorelnano.firebaseapp.com",
        databaseURL: "https://comedorelnano-default-rtdb.firebaseio.com",
        projectId: "comedorelnano",
        storageBucket: "comedorelnano.firebasestorage.app",
        messagingSenderId: "97043404893",
        appId: "1:97043404893:web:239bf2c53ae336519ed5b4",
        measurementId: "G-1MYL204D0P"
      };
      try {
        if (!firebase.apps || !firebase.apps.length) {
          firebase.initializeApp(firebaseConfig);
        }
        window.notificacionesRef = firebase.database().ref('notificaciones');
        window.devicesRef = firebase.database().ref('devices');
        // Preparar FCM (Messaging) en la página
        try {
          window.messaging = firebase.messaging();
          log('[FCM] Messaging listo (foreground)');
        } catch (eMsg) {
          log(`[FCM] Messaging no disponible en esta página: ${eMsg && eMsg.message ? eMsg.message : eMsg}`);
        }
        log('[Firebase] Inicializado y canal listo');
      } catch (e) {
        log(`[Firebase] Error al inicializar: ${e && e.message ? e.message : e}`);
      }

      // Audio: habilitar y reproducir un beep al recibir notificaciones
      let audioCtx = null;
      let sonidoHabilitado = false;
      const audioSrc = '/iPhone%20Notification%20%20Sound%20Effect%20-%20Perfect%20Sounds.mp3';
      let notifAudio = null;
      // Diagnóstico: comprobar que el MP3 está accesible
      async function verifyAudioAsset() {
        try {
          const res = await fetch(audioSrc, { method: 'HEAD', cache: 'no-store' });
          log(`[Audio] MP3 accesible: estado ${res.status}`);
        } catch (e) {
          log(`[Audio] MP3 no accesible desde este origen: ${e && e.message ? e.message : e}`);
        }
      }
      function initAudio() {
        try {
          // Crear audio HTML para reproducir el MP3
          if (!notifAudio) {
            notifAudio = new Audio(audioSrc);
            notifAudio.preload = 'auto';
            notifAudio.loop = false;
            notifAudio.volume = 1.0;
          }
          // Desbloquear reproducción con una interacción del usuario
          notifAudio.currentTime = 0;
          notifAudio.play()
            .then(() => {
              notifAudio.pause();
              notifAudio.currentTime = 0;
              sonidoHabilitado = true;
              log('[Audio] Sonido personalizado habilitado');
            })
            .catch(e => {
              // Fallback: habilitar WebAudio por si el HTMLAudio falla
              audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
              audioCtx.resume();
              sonidoHabilitado = true;
              log(`[Audio] HTMLAudio bloqueado, uso fallback WebAudio: ${e && e.message ? e.message : e}`);
            });
        } catch (e) {
          log(`[Audio] Error al habilitar sonido: ${e && e.message ? e.message : e}`);
        }
      }
      function playBeep() {
        if (!sonidoHabilitado) return;
        try {
          if (notifAudio) {
            notifAudio.currentTime = 0;
            notifAudio.play().catch(err => {
              log(`[Audio] Error al reproducir MP3: ${err && err.message ? err.message : err}`);
              // Fallback WebAudio
              const ctx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
              const o = ctx.createOscillator();
              const g = ctx.createGain();
              o.type = 'sine';
              o.frequency.value = 880;
              g.gain.setValueAtTime(0.0001, ctx.currentTime);
              g.gain.exponentialRampToValueAtTime(0.3, ctx.currentTime + 0.02);
              g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.5);
              o.connect(g).connect(ctx.destination);
              o.start();
              o.stop(ctx.currentTime + 0.5);
            });
          } else {
            // Si por alguna razón no existe el audio, usar WebAudio
            const ctx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
            const o = ctx.createOscillator();
            const g = ctx.createGain();
            o.type = 'sine';
            o.frequency.value = 880;
            g.gain.setValueAtTime(0.0001, ctx.currentTime);
            g.gain.exponentialRampToValueAtTime(0.3, ctx.currentTime + 0.02);
            g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.5);
            o.connect(g).connect(ctx.destination);
            o.start();
            o.stop(ctx.currentTime + 0.5);
          }
        } catch (e) {
          log(`[Audio] Error al reproducir beep: ${e && e.message ? e.message : e}`);
        }
      }
      document.getElementById('btnActivarSonido').addEventListener('click', initAudio);
      document.getElementById('btnProbarSonido').addEventListener('click', () => {
        initAudio();
        setTimeout(() => {
          playBeep();
          log('[Audio] Prueba de sonido ejecutada');
        }, 120);
      });
      // Activar push (FCM): obtener token y guardarlo
      const VAPID_PUBLIC_KEY = 'REEMPLAZAR_CON_TU_VAPID_PUBLIC_KEY';
      async function activarPushFCM() {
        log('[FCM] Iniciando activación de push');
        if (!window.messaging) {
          alert('FCM Messaging no está disponible en esta página.');
          log('[FCM] Messaging no disponible');
          return;
        }
        if (!('serviceWorker' in navigator)) {
          alert('Este navegador no soporta Service Worker requerido por FCM.');
          log('[FCM] SW no soportado');
          return;
        }
        try {
          const permiso = await Notification.requestPermission();
          log(`[FCM] Permiso de notificación: ${permiso}`);
          if (permiso !== 'granted') {
            alert('Debes permitir notificaciones para activar push.');
            return;
          }
        } catch {}
        if (!VAPID_PUBLIC_KEY || VAPID_PUBLIC_KEY.includes('REEMPLAZAR')) {
          alert('Configura VAPID_PUBLIC_KEY para obtener el token de FCM.');
          log('[FCM] Falta VAPID_PUBLIC_KEY, no se puede obtener token');
          return;
        }
        try {
          const reg = await navigator.serviceWorker.ready;
          const token = await window.messaging.getToken({ vapidKey: VAPID_PUBLIC_KEY, serviceWorkerRegistration: reg });
          if (!token) {
            log('[FCM] No se obtuvo token (null)');
            alert('No se pudo obtener token FCM.');
            return;
          }
          log(`[FCM] Token obtenido: ${String(token).slice(0, 12)}…`);
          await firebase.database().ref('fcmTokens').child(clientId).set({
            token,
            clientId,
            deviceName: localStorage.getItem('deviceName') || null,
            userAgent: navigator.userAgent,
            createdAt: Date.now()
          });
          log('[FCM] Token guardado en Realtime Database (fcmTokens)');
          alert('Push (FCM) activado: token guardado.');
        } catch (e) {
          log(`[FCM] Error activando push: ${e && e.message ? e.message : e}`);
          alert('Error activando push (FCM). Revisa la consola.');
        }
      }
      document.getElementById('btnActivarPush').addEventListener('click', activarPushFCM);
      // Auto-desbloqueo con cualquier interacción del usuario (click/touch/tecla)
      const autoUnlock = () => { if (!sonidoHabilitado) { initAudio(); log('[Audio] Auto-desbloqueo por interacción'); } };
      window.addEventListener('pointerdown', autoUnlock, { once: true });
      window.addEventListener('keydown', autoUnlock, { once: true });
      window.addEventListener('touchstart', autoUnlock, { once: true });
      // Si la página está visible cuando llega una notificación, reforzar beep
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible' && sonidoHabilitado) {
          // pequeño refuerzo al volver al frente
          setTimeout(() => playBeep(), 100);
        }
      });
      // FCM en foreground (si está disponible): reproducir sonido y loguear
      if (window.messaging && window.messaging.onMessage) {
        window.messaging.onMessage((payload) => {
          log(`[FCM] Mensaje en foreground: ${payload && payload.notification ? payload.notification.title : ''}`);
          try { playBeep(); } catch {}
        });
      }
      // Lanzar el chequeo del recurso de audio al cargar
      verifyAudioAsset();

      // Gestión de identificación y registro del dispositivo
      function ensureClientId() {
        let id = localStorage.getItem('clientId');
        if (!id) {
          id = 'dev_' + Math.random().toString(36).slice(2) + '_' + Date.now();
          localStorage.setItem('clientId', id);
        }
        return id;
      }
      const clientId = ensureClientId();
      const deviceNameInput = document.getElementById('deviceNameInput');
      deviceNameInput.value = localStorage.getItem('deviceName') || '';

      async function registerDevice() {
        const name = deviceNameInput.value.trim() || `Dispositivo ${clientId.slice(-5)}`;
        localStorage.setItem('deviceName', name);
        const payload = {
          name,
          clientId,
          userAgent: navigator.userAgent,
          lastSeen: Date.now()
        };
        await window.devicesRef.child(clientId).set(payload);
        log(`[Device] Registrado: ${name} (${clientId})`);
      }
      document.getElementById('btnRegistrarDispositivo').addEventListener('click', registerDevice);

      // Presencia: actualizar lastSeen periódicamente
      setInterval(() => {
        try { window.devicesRef.child(clientId).update({ lastSeen: Date.now() }); } catch {}
      }, 30000);

      // Popular selector de dispositivos
      const deviceSelector = document.getElementById('deviceSelector');
      function upsertOption(dev) {
        const id = dev.clientId;
        let opt = deviceSelector.querySelector(`option[value="${id}"]`);
        const label = `${dev.name || 'Sin nombre'} (${String(id).slice(-5)})`;
        if (!opt) {
          opt = document.createElement('option');
          opt.value = id;
          opt.textContent = label;
          deviceSelector.appendChild(opt);
        } else {
          opt.textContent = label;
        }
      }
      window.devicesRef.on('child_added', snap => { const dev = snap.val(); if (dev) { upsertOption(dev); upsertDeviceRow(dev); } });
      window.devicesRef.on('child_changed', snap => { const dev = snap.val(); if (dev) { upsertOption(dev); upsertDeviceRow(dev); } });

      // Enviar notificación global
      document.getElementById('btnNotificarPrueba').addEventListener('click', async () => {
        log('[Notificar-Prueba] Click recibido');
        try {
          // No bloquear el envío por permisos de notificación
          try {
            const permiso = await Notification.requestPermission();
            log(`[Notificar-Prueba] Estado permiso: ${permiso}`);
          } catch {}
          const payload = {
            titulo: 'Aviso de Taxis (Prueba)',
            mensaje: 'Notificación enviada desde prueba.html 🚖',
            url: location.href,
            timestamp: Date.now(),
            targetClientId: deviceSelector.value === 'all' ? null : deviceSelector.value
          };
          await window.notificacionesRef.push(payload);
          log('[Notificar-Prueba] Notificación publicada en Firebase');
        } catch (err) {
          log(`[Notificar-Prueba] Error al publicar: ${err && err.message ? err.message : err}`);
          alert('No se pudo publicar la notificación global.');
        }
      });

      // Escuchar y mostrar notificaciones recibidas
      window.notificacionesRef.limitToLast(50).on('child_added', async (snapshot) => {
        const data = snapshot.val();
        if (!data) return;
        // Filtrar si la notificación es dirigida a otro dispositivo
        if (data.targetClientId && data.targetClientId !== clientId) {
          return;
        }
        try {
          const reg = await navigator.serviceWorker.ready; // En móviles, usar siempre showNotification desde el SW
          const opciones = {
            body: data.mensaje || '',
            icon: 'https://i.ibb.co/m5WDvjFm/imagen-2025-10-22-173714897.png',
            badge: 'https://i.ibb.co/m5WDvjFm/imagen-2025-10-22-173714897.png',
            tag: 'taxi-reserva-aviso',
            renotify: true,
            requireInteraction: true,
            silent: false,
            data: { url: data.url || location.href, ts: data.timestamp || Date.now() },
            vibrate: [200, 100, 200]
          };
          if (!reg || !reg.showNotification) {
            log('[Prueba] SW no listo para mostrar notificaciones. Asegura HTTPS y registro del SW.');
            return;
          }
          reg.showNotification(data.titulo || 'TAXIS | Prueba', opciones);
          // Intentar reproducir sonido local
          playBeep();
          log('[Prueba] Notificación mostrada');
        } catch (err) {
          log(`[Prueba] Error mostrando notificación: ${err && err.message ? err.message : err}`);
        }
      });

      // Enviar dirigido a un clientId específico
      async function sendToClient(targetClientId) {
        log(`[Notificar-Dirigido] Enviando a ${String(targetClientId).slice(-5)}`);
        try {
          // No bloquear el envío por permisos de notificación
          try {
            const permiso = await Notification.requestPermission();
            log(`[Notificar-Dirigido] Estado permiso: ${permiso}`);
          } catch {}
          const payload = {
            titulo: 'Aviso de Taxis (Dirigido)',
            mensaje: 'Notificación enviada a un dispositivo específico 🚖',
            url: location.href,
            timestamp: Date.now(),
            targetClientId
          };
          await window.notificacionesRef.push(payload);
          log('[Notificar-Dirigido] Notificación publicada');
        } catch (err) {
          log(`[Notificar-Dirigido] Error: ${err && err.message ? err.message : err}`);
        }
      }

      // Render de filas por dispositivo con botón "Enviar"
      function upsertDeviceRow(dev) {
        const id = dev.clientId;
        const rowId = `device-row-${id}`;
        let row = document.getElementById(rowId);
        const label = `${dev.name || 'Sin nombre'} (${String(id).slice(-5)})` + (id === clientId ? ' • Este' : '');
        if (!row) {
          row = document.createElement('div');
          row.id = rowId;
          row.style.display = 'flex';
          row.style.alignItems = 'center';
          row.style.justifyContent = 'space-between';
          row.style.gap = '12px';
          row.style.padding = '8px 12px';
          row.style.border = '1px solid #333';
          row.style.borderRadius = '8px';
          row.style.background = '#0f0f0f';

          const nameEl = document.createElement('div');
          nameEl.textContent = label;
          nameEl.style.color = '#ffde59';

          const sendBtn = document.createElement('button');
          sendBtn.textContent = 'Enviar';
          sendBtn.style.padding = '6px 12px';
          sendBtn.style.borderRadius = '8px';
          sendBtn.style.border = '2px solid #ffde59';
          sendBtn.style.background = '#000';
          sendBtn.style.color = '#ffde59';
          sendBtn.style.cursor = 'pointer';
          sendBtn.addEventListener('click', () => sendToClient(id));

          row.appendChild(nameEl);
          row.appendChild(sendBtn);
          deviceListEl.appendChild(row);
        } else {
          const nameEl = row.firstChild;
          if (nameEl) nameEl.textContent = label;
        }
      }
    </script>
  </body>
</html>
