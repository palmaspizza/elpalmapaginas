<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Palma Chat</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --bg:#0a0a12;--bg2:#101020;--card:#171728;--card2:#1e1e32;
            --border:#2a2a42;--fg:#e6e6f0;--fg2:#c0c0d0;--muted:#6a6a82;
            --accent:#ff5e3a;--accent2:#ff2d55;--accent-soft:rgba(255,94,58,0.1);
            --accent-glow:rgba(255,94,58,0.25);--success:#34c759;--error:#ff453a;--warning:#ff9f0a;
            --voice:#34c759;--voice-soft:rgba(52,199,89,0.1);--voice-glow:rgba(52,199,89,0.25);
        }
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Space Grotesk',sans-serif;background:var(--bg);color:var(--fg);overflow:hidden;height:100dvh;width:100vw}
        ::-webkit-scrollbar{width:5px}
        ::-webkit-scrollbar-track{background:transparent}
        ::-webkit-scrollbar-thumb{background:var(--border);border-radius:10px}

        /* ===== LOGIN ===== */
        #loginScreen{position:fixed;inset:0;z-index:2000;display:flex;align-items:center;justify-content:center;background:var(--bg);overflow:hidden}
        .login-bg{position:absolute;inset:0;pointer-events:none;z-index:0}
        .blob{position:absolute;border-radius:50%;filter:blur(100px);opacity:.4;animation:blobF 8s ease-in-out infinite alternate}
        .blob-1{width:350px;height:350px;background:radial-gradient(circle,var(--accent),transparent 70%);top:-10%;left:-5%}
        .blob-2{width:280px;height:280px;background:radial-gradient(circle,var(--accent2),transparent 70%);bottom:-10%;right:-5%;animation-delay:-3s;animation-duration:10s}
        .blob-3{width:200px;height:200px;background:radial-gradient(circle,#ff9f0a,transparent 70%);top:50%;left:60%;animation-delay:-5s;animation-duration:12s}
        @keyframes blobF{0%{transform:translate(0,0) scale(1)}33%{transform:translate(30px,-20px) scale(1.1)}66%{transform:translate(-20px,30px) scale(.9)}100%{transform:translate(15px,15px) scale(1.05)}}
        .login-card{position:relative;z-index:1;background:rgba(23,23,40,.75);backdrop-filter:blur(40px);-webkit-backdrop-filter:blur(40px);border:1px solid rgba(255,255,255,.06);border-radius:24px;padding:48px 40px;width:90%;max-width:420px;text-align:center;animation:cardIn .6s cubic-bezier(.16,1,.3,1) both}
        @keyframes cardIn{from{opacity:0;transform:translateY(30px) scale(.95)}to{opacity:1;transform:translateY(0) scale(1)}}
        .login-icon{width:72px;height:72px;border-radius:20px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;margin:0 auto 24px;font-size:30px;color:#fff;box-shadow:0 8px 32px var(--accent-glow)}
        .login-card h1{font-size:28px;font-weight:800;background:linear-gradient(135deg,var(--fg),var(--fg2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px}
        .login-card p{color:var(--muted);font-size:14px;margin-bottom:32px}
        /* SIN value="bin", SIN z-index en el input para evitar conflictos de stacking */
        .login-input{width:100%;padding:14px 18px;background:rgba(255,255,255,.04);border:1.5px solid var(--border);border-radius:14px;color:var(--fg);font-size:16px;font-family:inherit;outline:none;transition:all .3s;margin-bottom:16px;-webkit-user-select:text;user-select:text}
        .login-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);background:rgba(255,255,255,.06)}
        .login-input::placeholder{color:var(--muted)}
        .login-btn{width:100%;padding:14px;background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;border-radius:14px;color:#fff;font-size:16px;font-weight:700;font-family:inherit;cursor:pointer;transition:all .3s;box-shadow:0 4px 20px var(--accent-glow)}
        .login-btn:hover{transform:translateY(-2px);box-shadow:0 8px 30px var(--accent-glow)}
        .login-btn:active{transform:translateY(0)}
        .login-error{color:var(--error);font-size:13px;margin-top:-8px;margin-bottom:12px;min-height:20px}
        .notif-banner{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px 18px;margin-top:16px;text-align:left;display:flex;align-items:center;gap:12px}
        .notif-banner i{font-size:20px;color:var(--warning);flex-shrink:0}
        .notif-banner p{font-size:13px;color:var(--fg2);line-height:1.4;flex:1}
        .notif-banner button{padding:6px 14px;background:var(--accent);border:none;border-radius:8px;color:#fff;font-size:12px;font-weight:600;font-family:inherit;cursor:pointer;white-space:nowrap;flex-shrink:0}

        /* ===== CHAT ===== */
        #chatScreen{display:none;flex-direction:column;height:100dvh;background:var(--bg);background-image:radial-gradient(ellipse at 15% 80%,rgba(255,94,58,.025) 0%,transparent 50%),radial-gradient(ellipse at 85% 15%,rgba(255,45,85,.02) 0%,transparent 50%)}
        .chat-header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:rgba(16,16,32,.85);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid rgba(255,255,255,.04);z-index:600;position:relative;flex-shrink:0}
        .header-left{display:flex;align-items:center;gap:10px}
        .header-logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:16px;color:#fff}
        .header-title{font-size:18px;font-weight:700}
        .header-right{display:flex;align-items:center;gap:8px}
        .header-user{font-size:13px;color:var(--muted);background:rgba(255,255,255,.04);padding:5px 12px;border-radius:20px;display:flex;align-items:center;gap:6px;cursor:pointer;transition:background .2s}
        .header-user:hover{background:rgba(255,255,255,.08)}
        .header-user .dot{width:7px;height:7px;border-radius:50%;background:var(--success);box-shadow:0 0 6px rgba(52,199,89,.5)}
        .icon-btn{width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.04);color:var(--fg2);font-size:15px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s}
        .icon-btn:hover{background:rgba(255,255,255,.08);color:var(--fg)}
        .icon-btn.active{background:var(--accent-soft);color:var(--accent);border-color:rgba(255,94,58,.2)}
        .cooldown-container{height:3px;background:transparent;flex-shrink:0;overflow:hidden;position:relative;z-index:600}
        .cooldown-bar{height:100%;width:0%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:0 2px 2px 0;transition:width .1s linear}
        .messages-area{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:8px;position:relative}
        .empty-state{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--muted);text-align:center}
        .empty-state i{font-size:48px;opacity:.3}
        .empty-state p{font-size:14px;max-width:260px;line-height:1.5}

        /* Mensajes */
        .msg-row{display:flex;flex-direction:column;max-width:75%;animation:msgIn .35s cubic-bezier(.16,1,.3,1) both;position:relative}
        .msg-row.self{align-self:flex-end;align-items:flex-end}
        .msg-row.other{align-self:flex-start;align-items:flex-start}
        .msg-row.system-msg{align-self:center;align-items:center;max-width:90%}
        @keyframes msgIn{from{opacity:0;transform:translateY(12px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
        .msg-sender{font-size:11px;font-weight:600;color:var(--muted);margin-bottom:4px;padding:0 4px;text-transform:uppercase;letter-spacing:.5px}
        .msg-bubble{padding:10px 14px;border-radius:18px;font-size:14px;line-height:1.5;position:relative;word-break:break-word}
        .msg-row.self .msg-bubble{background:linear-gradient(135deg,var(--accent),#e0442a);color:#fff;border-bottom-right-radius:6px;box-shadow:0 2px 12px rgba(255,94,58,.15)}
        .msg-row.other .msg-bubble{background:var(--card);border:1px solid rgba(255,255,255,.04);color:var(--fg);border-bottom-left-radius:6px}
        .msg-row.system-msg .msg-bubble{background:rgba(52,199,89,0.08);border:1px solid rgba(52,199,89,0.12);color:var(--success);font-size:12px;border-radius:12px;padding:6px 14px;text-align:center}
        .msg-bubble img{max-width:100%;max-height:300px;border-radius:12px;margin-top:6px;cursor:pointer;transition:opacity .2s;display:block}
        .msg-bubble img:hover{opacity:.85}
        .msg-time{font-size:10px;color:var(--muted);margin-top:3px;padding:0 4px}
        .msg-row.self .msg-time{text-align:right}
        /* Botón eliminar: siempre visible en táctil, hover en desktop */
        .msg-delete{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;background:var(--error);border:2px solid var(--bg);color:#fff;font-size:9px;display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:1;transition:all .2s;z-index:2}
        @media(hover:hover){.msg-delete{opacity:0}.msg-row.self:hover .msg-delete{opacity:1}}
        .msg-delete:hover{transform:scale(1.15)}

        /* Input */
        .chat-footer{padding:10px 12px;padding-bottom:max(10px,env(safe-area-inset-bottom));background:rgba(16,16,32,.9);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid rgba(255,255,255,.04);flex-shrink:0;position:relative;z-index:600}
        .input-row{display:flex;align-items:flex-end;gap:8px}
        .msg-input-wrap{flex:1;position:relative;background:rgba(255,255,255,.04);border:1.5px solid var(--border);border-radius:16px;transition:all .3s;display:flex;align-items:flex-end}
        .msg-input-wrap:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
        .msg-input{flex:1;padding:11px 14px;background:transparent;border:none;color:var(--fg);font-size:15px;font-family:inherit;outline:none;resize:none;max-height:120px;line-height:1.4}
        .msg-input::placeholder{color:var(--muted)}
        .img-preview-mini{padding:4px 4px 4px 14px;display:flex;align-items:center;gap:6px}
        .img-preview-mini img{width:36px;height:36px;border-radius:8px;object-fit:cover}
        .img-preview-mini button{width:20px;height:20px;border-radius:50%;background:rgba(255,255,255,.1);border:none;color:var(--muted);font-size:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
        .img-preview-mini button:hover{background:var(--error);color:#fff}
        .send-btn{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;color:#fff;font-size:16px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s;box-shadow:0 3px 12px var(--accent-glow);flex-shrink:0}
        .send-btn:hover{transform:translateY(-1px);box-shadow:0 6px 20px var(--accent-glow)}
        .send-btn:active{transform:scale(.95)}
        .send-btn:disabled{opacity:.35;cursor:not-allowed;transform:none;box-shadow:none}

        /* ===== DIBUJO ===== */
        #drawOverlay{position:fixed;inset:0;z-index:500;pointer-events:none;display:none}
        #drawOverlay.active{pointer-events:auto;background:rgba(0,0,0,.12);display:block}
        #drawCanvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
        #drawOverlay.active #drawCanvas{cursor:crosshair}
        .draw-timer-bar{position:absolute;top:0;left:0;right:0;height:4px;background:rgba(255,255,255,.05);z-index:10;display:none}
        #drawOverlay.active .draw-timer-bar{display:block}
        .draw-timer-fill{height:100%;width:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:0 2px 2px 0;transition:width .05s linear}
        .draw-toolbar{position:absolute;top:16px;left:50%;transform:translateX(-50%);background:rgba(23,23,40,.92);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border:1px solid rgba(255,255,255,.08);border-radius:20px;padding:10px 16px;display:none;align-items:center;gap:10px;z-index:20;box-shadow:0 8px 32px rgba(0,0,0,.4);flex-wrap:wrap;justify-content:center;max-width:calc(100vw - 24px)}
        #drawOverlay.active .draw-toolbar{display:flex;animation:toolbarIn .3s cubic-bezier(.16,1,.3,1) both}
        @keyframes toolbarIn{from{opacity:0;transform:translateX(-50%) translateY(-20px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
        .color-swatch{width:28px;height:28px;border-radius:50%;border:2px solid transparent;cursor:pointer;transition:all .2s;flex-shrink:0}
        .color-swatch.active{border-color:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.2);transform:scale(1.1)}
        .draw-sep{width:1px;height:24px;background:rgba(255,255,255,.08);flex-shrink:0}
        .brush-slider{width:70px;height:4px;-webkit-appearance:none;appearance:none;background:rgba(255,255,255,.1);border-radius:2px;outline:none;cursor:pointer}
        .brush-slider::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:16px;height:16px;border-radius:50%;background:var(--accent);cursor:pointer}
        .brush-slider::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--accent);cursor:pointer;border:none}
        .draw-tool-btn{width:32px;height:32px;border-radius:10px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.06);color:var(--fg2);font-size:13px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s;flex-shrink:0}
        .draw-tool-btn.active{background:var(--accent-soft);color:var(--accent);border-color:rgba(255,94,58,.2)}
        .draw-hint{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);background:rgba(23,23,40,.8);backdrop-filter:blur(20px);padding:8px 16px;border-radius:12px;font-size:12px;color:var(--muted);border:1px solid rgba(255,255,255,.06);z-index:20;display:none;white-space:nowrap}
        #drawOverlay.active .draw-hint{display:block;animation:toolbarIn .4s .15s cubic-bezier(.16,1,.3,1) both}

        /* ===== VOICE CHAT ===== */
        .voice-btn.active{background:var(--voice-soft);color:var(--voice);border-color:rgba(52,199,89,.2)}
        .voice-btn.active.muted{color:var(--muted);background:rgba(255,255,255,.04);border-color:var(--border)}
        @keyframes voiceRing{0%,100%{box-shadow:0 0 0 0 rgba(52,199,89,.3)}50%{box-shadow:0 0 0 7px rgba(52,199,89,0)}}
        .voice-btn.active:not(.muted){animation:voiceRing 2s ease-in-out infinite}
        .voice-glow{position:fixed;top:-60px;left:50%;transform:translateX(-50%);width:350px;height:120px;background:radial-gradient(ellipse,rgba(52,199,89,.07) 0%,transparent 70%);pointer-events:none;z-index:599;opacity:0;transition:opacity .6s}
        .voice-glow.active{opacity:1}
        #voicePanel{position:fixed;bottom:140px;right:12px;width:230px;background:rgba(20,20,36,.94);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border:1px solid rgba(255,255,255,.06);border-radius:18px;z-index:601;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.45);display:none;flex-direction:column}
        #voicePanel.visible{display:flex;animation:voicePanelIn .35s cubic-bezier(.16,1,.3,1) both}
        @keyframes voicePanelIn{from{opacity:0;transform:translateY(12px) scale(.95)}to{opacity:1;transform:translateY(0) scale(1)}}
        .voice-panel-head{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid rgba(255,255,255,.04)}
        .voice-live{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--voice);letter-spacing:.3px}
        .voice-live-dot{width:7px;height:7px;border-radius:50%;background:var(--voice);box-shadow:0 0 8px rgba(52,199,89,.5);animation:vDot 1.4s ease-in-out infinite}
        @keyframes vDot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.75)}}
        .voice-panel-btns{display:flex;gap:5px}
        .voice-panel-btns .vbtn{width:30px;height:30px;border-radius:9px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.05);color:var(--fg2);font-size:12px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s}
        .voice-panel-btns .vbtn.muted-active{background:rgba(255,159,10,.12);color:var(--warning);border-color:rgba(255,159,10,.2)}
        .voice-panel-btns .vbtn.leave-btn:hover{background:rgba(255,69,58,.15);color:var(--error);border-color:rgba(255,69,58,.2)}
        #voiceUsers{padding:6px 0;max-height:160px;overflow-y:auto}
        .voice-user-item{display:flex;align-items:center;gap:9px;padding:7px 14px;font-size:13px;color:var(--fg2)}
        .voice-user-dot{width:7px;height:7px;border-radius:50%;background:var(--voice);flex-shrink:0;box-shadow:0 0 6px rgba(52,199,89,.35)}
        .voice-user-item.me{color:var(--muted);font-style:italic}
        .voice-user-item.me .voice-user-dot{background:var(--accent);box-shadow:0 0 6px var(--accent-glow)}
        .voice-empty{padding:14px;text-align:center;font-size:12px;color:var(--muted)}
        #audioContainer{display:none}

        /* ===== SPEAKING ANIMATION ===== */
        #speakingWave{
            position:fixed;inset:0;z-index:49;pointer-events:none;
            display:flex;align-items:center;justify-content:center;
            opacity:0;transition:opacity .4s ease;
        }
        #speakingWave.visible{opacity:1}
        .sw-ring{
            position:absolute;border-radius:50%;
            border:2px solid rgba(52,199,89,.25);
            width:60px;height:60px;
        }
        .sw-ring:nth-child(1){animation:swRing 2.2s ease-out infinite 0s}
        .sw-ring:nth-child(2){animation:swRing 2.2s ease-out infinite .5s}
        .sw-ring:nth-child(3){animation:swRing 2.2s ease-out infinite 1s}
        .sw-ring:nth-child(4){animation:swRing 2.2s ease-out infinite 1.5s}
        @keyframes swRing{
            0%  {width:60px;height:60px;opacity:.95;border-color:rgba(52,199,89,.6);border-width:3px}
            100%{width:min(94vw,94vh);height:min(94vw,94vh);opacity:0;border-color:rgba(52,199,89,.02);border-width:1px}
        }
        #speakingLabel{
            position:absolute;bottom:100px;left:50%;transform:translateX(-50%);
            background:rgba(16,16,32,.9);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
            border:1px solid rgba(52,199,89,.3);border-radius:24px;
            padding:8px 20px;font-size:13px;font-weight:700;
            color:var(--voice);white-space:nowrap;letter-spacing:.3px;
            box-shadow:0 4px 24px rgba(0,0,0,.5);
        }

        /* ===== MODALES & TOASTS ===== */
        #toastContainer{position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none}
        .toast{padding:10px 18px;background:rgba(23,23,40,.92);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.06);border-radius:12px;font-size:13px;color:var(--fg);box-shadow:0 4px 20px rgba(0,0,0,.3);transform:translateX(100%);opacity:0;transition:all .35s cubic-bezier(.16,1,.3,1);pointer-events:auto;max-width:300px}
        .toast.show{transform:translateX(0);opacity:1}
        .toast-success{border-left:3px solid var(--success)}
        .toast-error{border-left:3px solid var(--error)}
        .toast-warning{border-left:3px solid var(--warning)}
        .toast-info{border-left:3px solid var(--accent)}
        #imgModal{display:none;position:fixed;inset:0;z-index:3000;background:rgba(0,0,0,.9);align-items:center;justify-content:center;cursor:pointer}
        #imgModal img{max-width:92vw;max-height:92vh;border-radius:12px;box-shadow:0 8px 40px rgba(0,0,0,.5)}
        @keyframes fadeIn{from{opacity:0}to{opacity:1}}

        @media(max-width:480px){
            .msg-row{max-width:88%}
            .login-card{padding:36px 24px}
            .header-user span{display:none}
            .draw-toolbar{padding:8px 10px;gap:6px}
            .color-swatch{width:24px;height:24px}
            .brush-slider{width:50px}
            #voicePanel{bottom:70px;right:8px;width:195px;border-radius:14px}
            .voice-user-item{font-size:12px;padding:6px 12px}
        }
        @keyframes spin{to{transform:rotate(360deg)}}
    </style>
</head>
<body>

<!-- Login — SIN value hardcodeado en el input -->
<div id="loginScreen">
    <div class="login-bg">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>
    <div class="login-card">
        <div class="login-icon"><i class="fas fa-comments"></i></div>
        <h1>Palma Chat</h1>
        <p>Ingresa tu nombre para unirte a la conversación</p>
        <input type="text" class="login-input" id="nameInput" placeholder="Tu nombre..." maxlength="20" autocomplete="off" autocorrect="off" autocapitalize="off">
        <div class="login-error" id="loginError"></div>
        <button class="login-btn" id="loginBtn">Entrar al chat</button>
        <div class="notif-banner" id="notifBanner" style="display:none">
            <i class="fas fa-bell"></i>
            <p>Activa las notificaciones para no perderte nada.</p>
            <button id="notifAllowBtn">Activar</button>
        </div>
    </div>
</div>

<!-- Chat -->
<div id="chatScreen"><button id="voiceBigBtn" title="Canal de voz">
    <i class="fas fa-microphone"></i>
</button>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-app.js";

    /* ========== FIREBASE ========== */

    /* ========== ESTADO GENERAL ========== */
    /* ========== ESTADO GENERAL ========== */

/* Chat listeners */
let listeningStarted = false;        // ← MOVER AQUÍ, antes de startListening
let msgListenerUnsub = null;

    /* ========== UTILIDADES ========== */
    function showToast(msg, type='info'){
        const t=document.createElement('div');
        t.className=`toast toast-${type}`;t.textContent=msg;
        toastContainer.appendChild(t);
        requestAnimationFrame(()=>requestAnimationFrame(()=>t.classList.add('show')));
        setTimeout(()=>{t.classList.remove('show');setTimeout(()=>t.remove(),350);},2800);
    }
    function formatTime(ts){return new Date(ts).toLocaleTimeString('es',{hour:'2-digit',minute:'2-digit'});}
    function getDeletedIds(){try{return JSON.parse(localStorage.getItem('chat_deleted')||'[]');}catch{return[];}}
    function addDeletedId(id){const l=getDeletedIds();if(!l.includes(id)){l.push(id);localStorage.setItem('chat_deleted',JSON.stringify(l));}}
    function escapeHTML(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
    function compressImage(file){
        return new Promise((res,rej)=>{
            const r=new FileReader();
            r.onerror=()=>rej(new Error('read'));
            r.onload=e=>{
                const img=new Image();
                img.onerror=()=>rej(new Error('img'));
                img.onload=()=>{
                    const c=document.createElement('canvas');
                    let w=img.width,h=img.height;
                    if(w>600){h=(600/w)*h;w=600;}if(h>600){w=(600/h)*w;h=600;}
                    c.width=Math.max(1,Math.round(w));c.height=Math.max(1,Math.round(h));
                    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
                    res(c.toDataURL('image/jpeg',0.5));
                };
                img.src=e.target.result;
            };
            r.readAsDataURL(file);
        });
    }

    /* ========== NOTIFICACIONES ========== */
    (function buildNotifIcon(){
        const c=document.createElement('canvas');c.width=64;c.height=64;
        const ctx=c.getContext('2d');
        const g=ctx.createLinearGradient(0,0,64,64);
        g.addColorStop(0,'#ff5e3a');g.addColorStop(1,'#ff2d55');
        ctx.fillStyle=g;ctx.beginPath();ctx.arc(32,32,30,0,Math.PI*2);ctx.fill();
        ctx.fillStyle='#fff';ctx.font='bold 30px Arial';ctx.textAlign='center';ctx.textBaseline='middle';
        ctx.fillText('P',32,33);
        notifIcon=c.toDataURL();
    })();
    function sendBrowserNotif(title,body){
        if(document.hidden&&Notification.permission==='granted'){
            try{new Notification(title,{body,icon:notifIcon});}catch(e){}
        }
    }
    if('Notification' in window&&Notification.permission==='default') notifBanner.style.display='flex';
    notifAllowBtn.onclick=()=>Notification.requestPermission().then(()=>notifBanner.style.display='none');
/* ========== ALERTAS NATIVAS (Vibración y Alarma del celular) ========== */
function triggerNativeAlert(isVoiceJoin) {
    if (window.AndroidBridge) {
        if (isVoiceJoin) {
            window.AndroidBridge.vibrateStrong();
            window.AndroidBridge.playAlarmSound();
            window.AndroidBridge.bringAppToFront();
        } else {
            window.AndroidBridge.playMessageSound();
        }
    }
    if (navigator.vibrate) {
        navigator.vibrate(isVoiceJoin ? [1000, 500, 1000, 500, 1000] : [300, 200, 300]);
    }
}
    /* ========== LOGIN ========== */
    function doLogin(){
        const val=nameInput.value.trim();
        if(!val){loginError.textContent='Escribe un nombre';nameInput.focus();return;}
        if(val.length<2){loginError.textContent='Mínimo 2 caracteres';nameInput.focus();return;}
        username=val;localStorage.setItem('chat_username',username);loginError.textContent='';
        enterChat();
    }
    function doLogout(){
        if(voiceActive)leaveVoice();
        if(msgListenerUnsub){msgListenerUnsub();msgListenerUnsub=null;listeningStarted=false;renderedIds.clear();}
        localStorage.removeItem('chat_username');username='';
        chatScreen.style.display='none';loginScreen.style.display='flex';
        nameInput.value='';setTimeout(()=>nameInput.focus(),100);
    }
    function playJoinSound(){
    try{
        const ctx=new(window.AudioContext||window.webkitAudioContext)();
        
        // Nota 1
        const o1=ctx.createOscillator();
        const g1=ctx.createGain();
        o1.connect(g1);g1.connect(ctx.destination);
        o1.type='sine';o1.frequency.setValueAtTime(880,ctx.currentTime);
        o1.frequency.exponentialRampToValueAtTime(1320,ctx.currentTime+0.15);
        g1.gain.setValueAtTime(0,ctx.currentTime);
        g1.gain.linearRampToValueAtTime(0.8,ctx.currentTime+0.02);
        g1.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.5);
        o1.start(ctx.currentTime);o1.stop(ctx.currentTime+0.5);

        // Nota 2 (eco)
        const o2=ctx.createOscillator();
        const g2=ctx.createGain();
        o2.connect(g2);g2.connect(ctx.destination);
        o2.type='sine';o2.frequency.setValueAtTime(1320,ctx.currentTime+0.18);
        o2.frequency.exponentialRampToValueAtTime(1760,ctx.currentTime+0.35);
        g2.gain.setValueAtTime(0,ctx.currentTime+0.18);
        g2.gain.linearRampToValueAtTime(0.6,ctx.currentTime+0.2);
        g2.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.8);
        o2.start(ctx.currentTime+0.18);o2.stop(ctx.currentTime+0.8);

        setTimeout(()=>ctx.close(),1000);
    }catch(e){}
}
    function enterChat(){
    loginScreen.style.display='none';chatScreen.style.display='flex';
    headerName.textContent=username;
    startListening();initDraw();startDrawSync();startStrokeCleanup();
    setTimeout(()=>msgInput.focus(),100);
    // AGREGAR ESTO:
    setTimeout(()=>{ messagesArea.scrollTop=messagesArea.scrollHeight; },300);
}
    loginBtn.onclick=doLogin;
    nameInput.onkeydown=e=>{if(e.key==='Enter')doLogin();loginError.textContent='';};
    logoutBtn.onclick=doLogout;
    if(username)enterChat();else setTimeout(()=>nameInput.focus(),100);

    /* ========== MENSAJES ========== */
    function canSend(){return Date.now()-lastSentTime>COOLDOWN_MS;}
    function startCooldown(){
        lastSentTime=Date.now();sendBtn.disabled=true;
        const start=Date.now();
        if(cooldownInterval)clearInterval(cooldownInterval);
        cooldownInterval=setInterval(()=>{
            const p=Math.min(1,(Date.now()-start)/COOLDOWN_MS);
            cooldownBar.style.width=(p*100)+'%';
            if(p>=1){clearInterval(cooldownInterval);cooldownBar.style.width='0%';sendBtn.disabled=false;}
        },50);
    }
    async function sendMessage(){
        const text=msgInput.value.trim();
        if(!text&&!pendingImage)return;
        if(!canSend())return showToast('Espera el cooldown','warning');
        sendBtn.disabled=true;
        const img=pendingImage;msgInput.value='';pendingImage=null;imgPreview.style.display='none';
        msgInput.style.height='auto';
        try{
            await push(messagesRef,{sender:username,text,image:img||null,timestamp:Date.now()});
            startCooldown();
        }catch(e){showToast('Error al enviar','error');sendBtn.disabled=false;}
    }
    sendBtn.onclick=sendMessage;
    msgInput.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage();}};
    msgInput.oninput=()=>{msgInput.style.height='auto';msgInput.style.height=Math.min(msgInput.scrollHeight,120)+'px';};

    imgBtn.onclick=()=>imgFileInput.click();
    imgFileInput.onchange=async e=>{
        const file=e.target.files[0];if(!file)return;
        if(!file.type.startsWith('image/')){showToast('Solo imágenes','error');imgFileInput.value='';return;}
        try{
            showToast('Procesando...','info');
            pendingImage=await compressImage(file);
            imgPreviewThumb.src=pendingImage;imgPreview.style.display='flex';
        }catch(e){showToast('Error al procesar imagen','error');}
        imgFileInput.value='';
    };
    imgPreviewRemove.onclick=()=>{pendingImage=null;imgPreview.style.display='none';};


    function startListening() {
    if (listeningStarted) return;
    listeningStarted = true;
    msgListenerUnsub = onValue(messagesRef, snap => {
            const data=snap.val();
            if(!data){emptyState.style.display='flex';return;}
            emptyState.style.display='none';
            const deleted=getDeletedIds();
            const sorted=Object.entries(data).sort((a,b)=>a[1].timestamp-b[1].timestamp);
            const newMsgs=[];
            sorted.forEach(([id,msg])=>{
                if(renderedIds.has(id))return;
                renderedIds.add(id);
                if(deleted.includes(id))return;
                renderMessage(id,msg);newMsgs.push(msg);
            });
            if(newMsgs.length>0){
                requestAnimationFrame(()=>{
                    const near=messagesArea.scrollHeight-messagesArea.scrollTop-messagesArea.clientHeight<200;
                    if(near)messagesArea.scrollTop=messagesArea.scrollHeight;
                });
                if(initialMessagesLoaded){
                    newMsgs.forEach(msg=>{
                        if(msg.sender!==username)
                            sendBrowserNotif(`${msg.sender} en Palma Chat`,msg.text||'📷 Imagen');
                            triggerNativeAlert(false);
                    });
                }
            }
            initialMessagesLoaded=true;
        });
    }
    function renderMessage(id,msg){
        const isMe=msg.sender===username;
        const row=document.createElement('div');
        row.className=`msg-row ${isMe?'self':'other'}`;row.id=`msg-${id}`;
        if(!isMe){const s=document.createElement('div');s.className='msg-sender';s.textContent=escapeHTML(msg.sender);row.appendChild(s);}
        const bubble=document.createElement('div');bubble.className='msg-bubble';
        if(msg.text){const t=document.createElement('span');t.textContent=msg.text;bubble.appendChild(t);}
        if(msg.image){
            const img=document.createElement('img');img.src=msg.image;img.alt='';img.loading='lazy';
            img.onclick=()=>{imgModalSrc.src=msg.image;imgModal.style.display='flex';};
            bubble.appendChild(img);
        }
        if(isMe){
            const del=document.createElement('button');del.className='msg-delete';
            del.innerHTML='<i class="fas fa-x"></i>';del.title='Eliminar';
            del.onclick=e=>{e.stopPropagation();addDeletedId(id);const el=$(`msg-${id}`);if(el){el.style.transition='all .3s';el.style.opacity='0';el.style.transform='scale(.9)';setTimeout(()=>el.remove(),300);}showToast('Mensaje ocultado','info');};
            bubble.appendChild(del);
        }
        row.appendChild(bubble);
        const time=document.createElement('div');time.className='msg-time';time.textContent=formatTime(msg.timestamp);
        row.appendChild(time);
        messagesArea.appendChild(row);
    }
    function addSystemMessage(text){
        const row=document.createElement('div');row.className='msg-row system-msg';
        const bubble=document.createElement('div');bubble.className='msg-bubble';
        bubble.innerHTML=`<i class="fas fa-microphone" style="margin-right:6px;font-size:11px"></i>${escapeHTML(text)}`;
        row.appendChild(bubble);messagesArea.appendChild(row);
        requestAnimationFrame(()=>{messagesArea.scrollTop=messagesArea.scrollHeight;});
    }
    imgModal.onclick=()=>{imgModal.style.display='none';imgModalSrc.src='';};

    /* ========== DIBUJO ========== */
    const DRAW_COLORS=['#ffffff','#ff5e3a','#ff9500','#ffcc00','#34c759','#00c7be','#007aff','#af52de','#ff2d55','#8e8e93'];
    function buildDrawTools(){
        DRAW_COLORS.forEach((c,i)=>{
            const s=document.createElement('div');s.className=`color-swatch ${i===0?'active':''}`;
            s.style.background=c;if(c==='#ffffff')s.style.border='2px solid rgba(255,255,255,.3)';
            s.onclick=()=>{drawColor=c;isEraser=false;drawToolbar.querySelectorAll('.color-swatch').forEach(x=>x.classList.remove('active'));s.classList.add('active');const eb=$('eraserBtn');if(eb)eb.classList.remove('active');};
            drawToolbar.appendChild(s);
        });
        const sep1=document.createElement('div');sep1.className='draw-sep';drawToolbar.appendChild(sep1);
        const slider=document.createElement('input');slider.type='range';slider.className='brush-slider';slider.min='2';slider.max='30';slider.value='4';
        slider.oninput=()=>{brushSizeVal=parseInt(slider.value);};drawToolbar.appendChild(slider);
        const sep2=document.createElement('div');sep2.className='draw-sep';drawToolbar.appendChild(sep2);
        const eb=document.createElement('button');eb.id='eraserBtn';eb.className='draw-tool-btn';eb.innerHTML='<i class="fas fa-eraser"></i>';eb.title='Borrador';
        eb.onclick=()=>{isEraser=!isEraser;eb.classList.toggle('active',isEraser);if(isEraser)drawToolbar.querySelectorAll('.color-swatch').forEach(x=>x.classList.remove('active'));};
        drawToolbar.appendChild(eb);
        const cb=document.createElement('button');cb.className='draw-tool-btn';cb.innerHTML='<i class="fas fa-trash-can"></i>';cb.title='Limpiar';
        cb.onclick=redrawStrokes;drawToolbar.appendChild(cb);
        const sep3=document.createElement('div');sep3.className='draw-sep';drawToolbar.appendChild(sep3);
        const xb=document.createElement('button');xb.className='draw-tool-btn';xb.innerHTML='<i class="fas fa-xmark"></i>';xb.title='Cerrar';
        xb.onclick=toggleDraw;drawToolbar.appendChild(xb);
    }
    buildDrawTools();

    function resizeCanvas(){
        const dpr=window.devicePixelRatio||1,w=window.innerWidth,h=window.innerHeight;
        drawCanvas.width=w*dpr;drawCanvas.height=h*dpr;
        drawCanvas.style.width=w+'px';drawCanvas.style.height=h+'px';
        drawCanvas.getContext('2d').setTransform(dpr,0,0,dpr,0,0);
        redrawStrokes();
    }
    function initDraw(){resizeCanvas();}
    window.addEventListener('resize',resizeCanvas);

    function getNorm(e){const t=e.touches?e.touches[0]:e;return{x:t.clientX/(window.innerWidth||1),y:t.clientY/(window.innerHeight||1)};}
    function getRaw(e){const t=e.touches?e.touches[0]:e;return{x:t.clientX,y:t.clientY};}

    function startStroke(e){
        if(!isDrawingMode)return;e.preventDefault();isDrawing=true;
        const n=getNorm(e),r=getRaw(e);lastX=r.x;lastY=r.y;
        currentStroke={color:drawColor,size:brushSizeVal,isEraser,points:[{x:n.x,y:n.y}],timestamp:Date.now()};
        resetDrawTimer();
        const ctx=drawCanvas.getContext('2d');
        ctx.globalCompositeOperation=isEraser?'destination-out':'source-over';
        ctx.fillStyle=isEraser?'rgba(0,0,0,1)':drawColor;
        ctx.beginPath();ctx.arc(r.x,r.y,Math.max(1,brushSizeVal/2),0,Math.PI*2);ctx.fill();
        ctx.globalCompositeOperation='source-over';
    }
    function moveStroke(e){
        if(!isDrawing||!isDrawingMode)return;e.preventDefault();
        const n=getNorm(e),r=getRaw(e);
        const lp=currentStroke.points[currentStroke.points.length-1];
        if((n.x-lp.x)**2+(n.y-lp.y)**2<0.000001)return;
        currentStroke.points.push({x:n.x,y:n.y});resetDrawTimer();
        const ctx=drawCanvas.getContext('2d');
        ctx.globalCompositeOperation=isEraser?'destination-out':'source-over';
        ctx.strokeStyle=isEraser?'rgba(0,0,0,1)':drawColor;
        ctx.lineWidth=brushSizeVal;ctx.lineCap='round';ctx.lineJoin='round';
        ctx.beginPath();ctx.moveTo(lastX,lastY);ctx.lineTo(r.x,r.y);ctx.stroke();
        ctx.globalCompositeOperation='source-over';
        lastX=r.x;lastY=r.y;
    }
    function endStroke(e){
        if(!isDrawing)return;if(e)e.preventDefault();isDrawing=false;
        if(!currentStroke||!currentStroke.points.length){currentStroke=null;return;}
        const sRef=push(drawingsRef),sId=sRef.key;
        processedStrokeIds.add(sId);
        const sd={color:currentStroke.color,size:currentStroke.size,isEraser:currentStroke.isEraser,points:currentStroke.points,timestamp:currentStroke.timestamp};
        activeStrokes.push({...sd,firebaseId:sId});
        set(sRef,sd).catch(console.error);
        currentStroke=null;
    }
    drawCanvas.addEventListener('mousedown',startStroke);drawCanvas.addEventListener('mousemove',moveStroke);
    drawCanvas.addEventListener('mouseup',endStroke);drawCanvas.addEventListener('mouseleave',endStroke);
    drawCanvas.addEventListener('touchstart',startStroke,{passive:false});drawCanvas.addEventListener('touchmove',moveStroke,{passive:false});
    drawCanvas.addEventListener('touchend',endStroke,{passive:false});drawCanvas.addEventListener('touchcancel',endStroke,{passive:false});

    function drawStroke(s){
        if(!s.points||!s.points.length)return;
        const ctx=drawCanvas.getContext('2d'),w=window.innerWidth,h=window.innerHeight;
        ctx.lineWidth=s.size;ctx.lineCap='round';ctx.lineJoin='round';
        if(s.isEraser){ctx.globalCompositeOperation='destination-out';ctx.strokeStyle='rgba(0,0,0,1)';ctx.fillStyle='rgba(0,0,0,1)';}
        else{ctx.globalCompositeOperation='source-over';ctx.strokeStyle=s.color;ctx.fillStyle=s.color;}
        if(s.points.length===1){ctx.beginPath();ctx.arc(s.points[0].x*w,s.points[0].y*h,Math.max(1,s.size/2),0,Math.PI*2);ctx.fill();}
        else{ctx.beginPath();ctx.moveTo(s.points[0].x*w,s.points[0].y*h);for(let i=1;i<s.points.length;i++)ctx.lineTo(s.points[i].x*w,s.points[i].y*h);ctx.stroke();}
        ctx.globalCompositeOperation='source-over';
    }
    function redrawStrokes(){
        const ctx=drawCanvas.getContext('2d'),dpr=window.devicePixelRatio||1;
        ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,drawCanvas.width,drawCanvas.height);
        ctx.setTransform(dpr,0,0,dpr,0,0);activeStrokes.forEach(s=>drawStroke(s));
        if(currentStroke&&currentStroke.points.length)drawStroke(currentStroke);
    }
    function startDrawSync(){
        if(drawSyncStarted)return;drawSyncStarted=true;
        onChildAdded(drawingsRef,snap=>{
            const s=snap.val();if(!s||!s.points)return;
            if(Date.now()-s.timestamp>DRAW_TIMEOUT_MS){remove(ref(db,`drawings/${snap.key}`));return;}
            if(processedStrokeIds.has(snap.key))return;
            processedStrokeIds.add(snap.key);activeStrokes.push({...s,firebaseId:snap.key});redrawStrokes();
        });
        onChildRemoved(drawingsRef,snap=>{
            const idx=activeStrokes.findIndex(s=>s.firebaseId===snap.key);
            if(idx!==-1){activeStrokes.splice(idx,1);redrawStrokes();}
        });
    }
    function startStrokeCleanup(){
        if(strokeCleanupInterval)return;
        strokeCleanupInterval=setInterval(async()=>{
            const now=Date.now();let changed=false;
            for(let i=activeStrokes.length-1;i>=0;i--){if(now-activeStrokes[i].timestamp>DRAW_TIMEOUT_MS){activeStrokes.splice(i,1);changed=true;}}
            if(changed)redrawStrokes();
            try{const snap=await get(drawingsRef);const data=snap.val();if(!data)return;Object.entries(data).forEach(([id,s])=>{if(now-s.timestamp>DRAW_TIMEOUT_MS+1000)remove(ref(db,`drawings/${id}`));});}catch(e){}
        },2500);
    }
    function resetDrawTimer(){drawTimerStart=Date.now();drawTimerFill.style.width='100%';}
    setInterval(()=>{if(!isDrawingMode||!drawTimerStart){drawTimerFill.style.width='100%';return;}drawTimerFill.style.width=(Math.max(0,1-(Date.now()-drawTimerStart)/DRAW_TIMEOUT_MS)*100)+'%';},60);
    function toggleDraw(){
        isDrawingMode=!isDrawingMode;drawOverlay.classList.toggle('active',isDrawingMode);drawToggleBtn.classList.toggle('active',isDrawingMode);
        if(isDrawingMode){resizeCanvas();resetDrawTimer();}
    }
    drawToggleBtn.onclick=toggleDraw;
    document.addEventListener('keydown',e=>{if(e.key==='Escape'&&isDrawingMode)toggleDraw();});


    /* ==========================================================
       WEBRTC VOICE CHAT — FIXES CRÍTICOS APLICADOS:
       1. ICE candidates serializados como objeto plano (no RTCIceCandidate)
       2. playsInline via setAttribute (obligatorio iOS)
       3. Queue separado para candidatos que llegan antes del PC
       4. getUserMedia sin sampleRate (rompe en móviles)
       5. leaveVoice limpia TODOS los listeners
       6. Lógica determinista con onChildAdded (no onValue)
       7. Web Audio API para detectar quién habla
    ========================================================== */
    const ICE_CONFIG={iceServers:[{urls:'stun:stun.l.google.com:19302'}]};

    const myVoiceId=(()=>{
        let id=localStorage.getItem('chat_voice_id');
        if(!id){id='v_'+Math.random().toString(36).substr(2,9);localStorage.setItem('chat_voice_id',id);}
        return id;
    })();

    let voiceActive=false, voiceJoining=false, localStream=null, isMuted=false;
    const voicePeers={};           // peerId → { pc, name, pendingCandidates[] }
    const iceCandidateQueue={};    // candidatos que llegan ANTES de crear el PC
    const voiceUnsubs=[];
    let speakingInterval=null;
    let audioCtx=null;
    const audioAnalyzers={};       // peerId → { analyser, source }

    /* --- Animación de habla --- */
    let statusHideTimer = null;
function showSpeaking(name){
    speakingLabel.textContent='🎙 '+name+' está hablando';
    speakingWave.style.display='flex';
    requestAnimationFrame(()=>speakingWave.classList.add('visible'));
    // Barra de estado
    const bar = document.getElementById('voiceStatusBar');
    const txt = document.getElementById('voiceStatusText');
    if(bar && txt){ txt.textContent = name+' está hablando'; bar.style.display='block'; }
    if(statusHideTimer){ clearTimeout(statusHideTimer); statusHideTimer=null; }
}
function hideSpeaking(){
    speakingWave.classList.remove('visible');
    setTimeout(()=>{if(!speakingWave.classList.contains('visible'))speakingWave.style.display='none';},400);
    // Ocultar barra con delay
    if(!statusHideTimer){
        statusHideTimer = setTimeout(()=>{
            const bar=document.getElementById('voiceStatusBar');
            if(bar) bar.style.display='none';
            statusHideTimer=null;
        }, 1500);
    }
}

    /* --- Web Audio API: detector de nivel para saber quién habla --- */
    function setupAnalyzer(peerId,stream){
        try{
            if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();
            if(audioCtx.state==='suspended')audioCtx.resume();
            const source=audioCtx.createMediaStreamSource(stream);
            const analyser=audioCtx.createAnalyser();
            analyser.fftSize=256;analyser.smoothingTimeConstant=0.5;
            source.connect(analyser); /* NO conectar a destination — el audio ya sale por el <audio> */
            audioAnalyzers[peerId]={analyser,source};
        }catch(e){console.warn('AudioContext error:',e);}
    }
    function checkSpeaking(){
        const buf=new Uint8Array(128);
        let loudest=null,loudestLevel=10;
        Object.entries(audioAnalyzers).forEach(([peerId,{analyser}])=>{
            analyser.getByteFrequencyData(buf);
            const avg=buf.reduce((a,b)=>a+b,0)/buf.length;
            if(avg>loudestLevel){loudestLevel=avg;loudest=peerId;}
        });
        if(loudest&&voicePeers[loudest])showSpeaking(voicePeers[loudest].name||'Alguien');
        else hideSpeaking();
    }
    function teardownAudio(){
        if(speakingInterval){clearInterval(speakingInterval);speakingInterval=null;}
        Object.values(audioAnalyzers).forEach(({source})=>{try{source.disconnect();}catch(e){}});
        Object.keys(audioAnalyzers).forEach(k=>delete audioAnalyzers[k]);
        if(audioCtx){audioCtx.close().catch(()=>{});audioCtx=null;}
        hideSpeaking();
    }

    /* --- Unirse al canal --- */
    async function joinVoice(){
        if(voiceJoining||voiceActive)return;
        voiceJoining=true;
        voiceToggleBtn.querySelector('i').className='fas fa-spinner';
        voiceToggleBtn.querySelector('i').style.animation='spin 1s linear infinite';

        /* CRÍTICO: echoCancellation + noiseSuppression + autoGainControl obligatorios.
           NO incluir sampleRate — falla en Android y algunos iOS. */
        try{
            localStream=await navigator.mediaDevices.getUserMedia({
                audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true},
                video:false
            });
        }catch(e){
            voiceJoining=false;
            voiceToggleBtn.querySelector('i').className='fas fa-microphone';
            voiceToggleBtn.querySelector('i').style.animation='';
            const msg=e.name==='NotAllowedError'||e.name==='PermissionDeniedError'
                ?'Permiso de micrófono denegado':'No se pudo acceder al micrófono';
            showToast(msg,'error');return;
        }

        voiceActive=true;isMuted=false;
        const joinedAt=Date.now();

        /* Presencia en Firebase con limpieza automática al desconectar */
        const pRef=ref(db,`voiceRoom/peers/${myVoiceId}`);
        await set(pRef,{name:username,ts:joinedAt});
        onDisconnect(pRef).remove();

        /* Limpiar señales viejas antes de escuchar */
        try{
            const old=await get(ref(db,`voiceRoom/signals/${myVoiceId}`));
            if(old.val())Object.keys(old.val()).forEach(k=>remove(ref(db,`voiceRoom/signals/${myVoiceId}/${k}`)));
        }catch(e){}

        setupVoiceListeners(joinedAt);

        /* Conectar con peers ya presentes al momento de unirse */
        try{
            const snap=await get(ref(db,'voiceRoom/peers'));
            const peers=snap.val()||{};
            Object.entries(peers).forEach(([peerId,data])=>{
                if(peerId===myVoiceId)return;
                /* Determinista: el ID lexicográficamente menor crea la oferta */
                if(myVoiceId<peerId){
                    createPeerConnection(peerId,data.name);
                    createOffer(peerId);
                }
                /* Si myVoiceId > peerId, el otro creará la oferta y la recibiremos */
            });
        }catch(e){console.error('Error getting peers:',e);}

        voiceToggleBtn.classList.add('voice-on');
voiceToggleBtn.querySelector('i').className='fas fa-microphone';
voiceToggleBtn.querySelector('i').style.animation='';
        voicePanel.classList.add('visible');
        voiceGlow.classList.add('active');
        isMuted=false;updateMuteUI();renderVoiceUsers();
        speakingInterval=setInterval(checkSpeaking,120);
        voiceJoining=false;
        addSystemMessage(`${username} se unió al canal de voz`);
        showToast('Canal de voz activo','success');
    }

    /* --- Salir del canal — limpieza COMPLETA --- */
    function leaveVoice(){
        voiceActive=false;
        remove(ref(db,`voiceRoom/peers/${myVoiceId}`));
        remove(ref(db,`voiceRoom/signals/${myVoiceId}`));

        /* Cerrar TODAS las conexiones y eliminar elementos <audio> */
        Object.entries(voicePeers).forEach(([peerId,p])=>{
            try{p.pc.close();}catch(e){}
            const el=document.getElementById(`audio_${peerId}`);
            if(el){el.pause();el.srcObject=null;el.remove();}
        });
        Object.keys(voicePeers).forEach(k=>delete voicePeers[k]);
        Object.keys(iceCandidateQueue).forEach(k=>delete iceCandidateQueue[k]);

        /* Detener stream local → libera el micrófono físico */
        if(localStream){localStream.getTracks().forEach(t=>t.stop());localStream=null;}

        /* Destruir TODOS los listeners de Firebase → evita duplicados y fugas */
        voiceUnsubs.forEach(fn=>{try{fn();}catch(e){}});
        voiceUnsubs.length=0;

        teardownAudio();

        voiceToggleBtn.classList.remove('voice-on','voice-muted');
voiceToggleBtn.querySelector('i').className='fas fa-microphone';
voiceToggleBtn.querySelector('i').style.animation='';
        voicePanel.classList.remove('visible');
        voiceGlow.classList.remove('active');
        renderVoiceUsers();
        addSystemMessage(`${username} salió del canal de voz`);
        showToast('Canal de voz desactivado','info');
    }

    /* --- Crear RTCPeerConnection --- */
    function createPeerConnection(peerId,peerName){
        if(voicePeers[peerId])return; /* Ya existe */

        const pc=new RTCPeerConnection(ICE_CONFIG);
        // DENTRO de createPeerConnection, cambiar:
voicePeers[peerId] = {
    pc,
    name: peerName || 'Desconocido',
    pendingCandidates: [],
    makingOffer: false,        // ← AGREGAR ESTO
    connected: false
};

        /* Aplicar candidatos ICE encolados que llegaron antes de crear el PC */
        if(iceCandidateQueue[peerId]){
            voicePeers[peerId].pendingCandidates.push(...iceCandidateQueue[peerId]);
            delete iceCandidateQueue[peerId];
        }

        /* Agregar tracks del stream local */
        if(localStream)localStream.getTracks().forEach(track=>pc.addTrack(track,localStream));

        /* CRÍTICO: serializar ICE candidate como objeto plano.
           RTCIceCandidate tiene sus propiedades en el prototipo (getters),
           NO como propiedades propias. Firebase serializa solo propiedades propias,
           resultando en {} vacío si se pasa el objeto directamente.
           Sin candidatos ICE la conexión P2P NUNCA se establece. */
        pc.onicecandidate = (event) => {
    if (!event.candidate) return;
    
    // ← ESTO YA ESTÁ BIEN en tu código, pero verificar:
    const candidateData = {
        candidate: event.candidate.candidate,
        sdpMid: event.candidate.sdpMid,
        sdpMLineIndex: event.candidate.sdpMLineIndex,
        usernameFragment: event.candidate.usernameFragment
    };
    
    sendSignal(peerId, {
        type: 'candidate',
        candidate: candidateData
    });
};

        /* CRÍTICO: playsInline debe ser un atributo HTML en iOS Safari.
           La propiedad JS audio.playsInline = true NO es suficiente en iOS. */
        pc.ontrack=event=>{
            let audio=document.getElementById(`audio_${peerId}`);
            if(!audio){
                audio=document.createElement('audio');
                audio.id=`audio_${peerId}`;
                audio.setAttribute('autoplay','');
                audio.setAttribute('playsinline','');         /* ← VITAL para iOS */
                audio.setAttribute('webkit-playsinline',''); /* ← Safari legacy */
                audio.preload='auto';
                audio.style.display='none';
                audioContainer.appendChild(audio);
            }
            if(event.streams&&event.streams[0]){
                audio.srcObject=event.streams[0];

                /* Configurar detector de habla con Web Audio API */
                setupAnalyzer(peerId,event.streams[0]);

                /* CRÍTICO: autoplay bloqueado en móvil si no hubo interacción previa.
                   Usamos { once:true } para que el listener se elimine solo. */
                audio.play().catch(()=>{
                    const retry=()=>{
                        audioContainer.querySelectorAll('audio').forEach(a=>{
                            if(a.paused&&a.srcObject)a.play().catch(()=>{});
                        });
                    };
                    document.addEventListener('click',retry,{once:true});
                    document.addEventListener('touchstart',retry,{once:true});
                });
            }
        };

        pc.onconnectionstatechange=()=>{
            renderVoiceUsers();
            const s=pc.connectionState;
            if(s==='disconnected'||s==='failed'||s==='closed')removeVoicePeer(peerId);
        };
        pc.oniceconnectionstatechange=()=>{
            if(pc.iceConnectionState==='failed')try{pc.restartIce();}catch(e){}
        };
    }

    /* --- Crear y enviar oferta --- */
    async function createOffer(peerId) {
    const peer = voicePeers[peerId];
    if (!peer || peer.makingOffer) return;  // ← EVITA OFERTAS CONCURRENTES
    peer.makingOffer = true;
    
    try {
        const offer = await peer.pc.createOffer({
            offerToReceiveAudio: true,
            offerToReceiveVideo: false
        });
        await peer.pc.setLocalDescription(offer);
        
        const signalRef = push(ref(db, `voiceRoom/signals/${peerId}`));
        await set(signalRef, {
            type: 'offer',
            from: myVoiceId,
            sdp: offer.sdp,
            createdAt: Date.now()
        });
    } catch (err) {
        console.error(`[VOZ] Error creando oferta para ${peerId}:`, err);
    } finally {
        peer.makingOffer = false;  // ← LIBERAR FLAG
    }
}

    /* --- Recibir oferta --- */
    async function handleOffer(signal){
        const fromId=signal.from;
        if(!voicePeers[fromId]){
            try{
                const snap=await get(ref(db,`voiceRoom/peers/${fromId}`));
                createPeerConnection(fromId,snap.val()?.name||'Desconocido');
            }catch(e){createPeerConnection(fromId,'Desconocido');}
        }
        const peer=voicePeers[fromId];if(!peer||!peer.pc)return;
        try{
            await peer.pc.setRemoteDescription(new RTCSessionDescription({type:'offer',sdp:signal.sdp}));
            /* Procesar candidatos ICE encolados que llegaron antes de la oferta */
            // En handleAnswer, mismo cambio:
while (peer.pendingCandidates.length > 0) {
    const cand = peer.pendingCandidates.shift();
    try {
        await peer.pc.addIceCandidate(cand);  // ← Objeto plano directo
    } catch (e) {
        console.warn('[VOZ] Error adding pending candidate:', e);
    }
}
            const answer=await peer.pc.createAnswer();
            await peer.pc.setLocalDescription(answer);
            sendSignal(fromId,{type:'answer',sdp:answer.sdp});
        }catch(e){console.error('Error handling offer from',fromId,e);}
    }

    /* --- Recibir respuesta --- */
    async function handleAnswer(signal){
        const peer=voicePeers[signal.from];if(!peer||!peer.pc)return;
        try{
            await peer.pc.setRemoteDescription(new RTCSessionDescription({type:'answer',sdp:signal.sdp}));
            while(peer.pendingCandidates.length>0){
                const cand=peer.pendingCandidates.shift();
                try{await peer.pc.addIceCandidate(new RTCIceCandidate(cand));}catch(e){}
            }
        }catch(e){console.error('Error handling answer from',signal.from,e);}
    }

    /* --- Recibir ICE candidate ---
       CRÍTICO: si el PC aún no existe, usar iceCandidateQueue (no crear entrada parcial).
       Si el PC existe pero no tiene remoteDescription, encolar en pendingCandidates. */
    async function handleCandidate(signal) {
    const fromId = signal.from;
    const rawCandidate = signal.candidate;
    
    // ← FIX: Reconstruir candidato con valores por defecto si vienen null
    const candidateInit = {
        candidate: rawCandidate.candidate,
        sdpMid: rawCandidate.sdpMid !== null ? rawCandidate.sdpMid : '0',
        sdpMLineIndex: rawCandidate.sdpMLineIndex !== null ? rawCandidate.sdpMLineIndex : 0,
        usernameFragment: rawCandidate.usernameFragment || undefined
    };
    
    const peer = voicePeers[fromId];
    
    // Si no hay PC, encolar en queue global
    if (!peer) {
        if (!iceCandidateQueue[fromId]) iceCandidateQueue[fromId] = [];
        iceCandidateQueue[fromId].push(candidateInit);
        return;
    }
    
    if (peer.pc.remoteDescription && peer.pc.remoteDescription.type) {
        try {
            // ← FIX: Pasar el objeto plano directamente, no new RTCIceCandidate
            await peer.pc.addIceCandidate(candidateInit);
        } catch (err) {
            console.error(`[VOZ] addIceCandidate error for ${fromId}:`, err);
        }
    } else {
        peer.pendingCandidates.push(candidateInit);
    }
}

    /* --- Enviar señal a Firebase --- */
    function sendSignal(toId,data){
        const sRef=push(ref(db,`voiceRoom/signals/${toId}`));
        set(sRef,{...data,from:myVoiceId,createdAt:Date.now()})
            .catch(e=>console.error('Error sending signal:',e));
    }

    /* --- Eliminar peer y liberar todos sus recursos --- */
    function removeVoicePeer(peerId){
        const peer=voicePeers[peerId];if(!peer)return;
        try{peer.pc.close();}catch(e){}
        const el=document.getElementById(`audio_${peerId}`);
        if(el){el.pause();el.srcObject=null;el.remove();}
        if(audioAnalyzers[peerId]){
            try{audioAnalyzers[peerId].source.disconnect();}catch(e){}
            delete audioAnalyzers[peerId];
        }
        delete voicePeers[peerId];
        renderVoiceUsers();
    }

    /* --- Listeners Firebase: señales, peers que entran, peers que salen --- */
    function setupVoiceListeners(joinedAt){
        /* Señales dirigidas a mí */
        const unsubSig=onChildAdded(ref(db,`voiceRoom/signals/${myVoiceId}`),async snap=>{
            const signal=snap.val();if(!signal)return;
            remove(snap.ref).catch(()=>{});
            /* Ignorar señales anteriores a esta sesión */
            if(signal.createdAt&&signal.createdAt<joinedAt-5000)return;
            if(signal.from===myVoiceId)return;
            if(signal.type==='offer')        await handleOffer(signal);
            else if(signal.type==='answer')  await handleAnswer(signal);
            else if(signal.type==='candidate')await handleCandidate(signal);
        });
        voiceUnsubs.push(unsubSig);

        /* Nuevos peers que se unen después de mí */
        const unsubAdd=onChildAdded(ref(db,'voiceRoom/peers'),snap=>{
    const peerId=snap.key,data=snap.val();
    if(!data||peerId===myVoiceId||voicePeers[peerId])return;
    renderVoiceUsers();
    // Notificación con sonido
    playJoinSound();
    sendBrowserNotif('🔔 Palma Chat',`${data.name} se unió al canal de voz`);
    showToast(`🎙 ${data.name} se unió al canal de voz`,'success');
        triggerNativeAlert(true);
            /* Determinista: ID menor crea la oferta */
            if(myVoiceId<peerId){
                createPeerConnection(peerId,data.name);
                createOffer(peerId);
            }
            /* Si myVoiceId > peerId, el otro par creará la oferta */
        });
        voiceUnsubs.push(unsubAdd);

        /* Peers que se van */
        const unsubRem=onChildRemoved(ref(db,'voiceRoom/peers'),snap=>{
            if(snap.key!==myVoiceId){removeVoicePeer(snap.key);renderVoiceUsers();}
        });
        voiceUnsubs.push(unsubRem);
    }

    /* --- Mute / Unmute: solo cambia track.enabled, no destruye el stream --- */
    function toggleMute(){
        if(!localStream||!voiceActive)return;
        isMuted=!isMuted;
        localStream.getAudioTracks().forEach(t=>{t.enabled=!isMuted;});
        updateMuteUI();
        showToast(isMuted?'Micrófono silenciado':'Micrófono activo',isMuted?'warning':'success');
    }
    function updateMuteUI(){
    voiceMuteBtn.classList.toggle('muted-active',isMuted);
    voiceMuteBtn.innerHTML=isMuted?'<i class="fas fa-microphone-slash"></i>':'<i class="fas fa-microphone"></i>';
    // Botón grande: rojo=muteado, verde=activo, gris=apagado
    voiceToggleBtn.classList.remove('voice-on','voice-muted');
    if(voiceActive){
        voiceToggleBtn.classList.add(isMuted ? 'voice-muted' : 'voice-on');
    }
    voiceToggleBtn.querySelector('i').className = isMuted
        ? 'fas fa-microphone-slash'
        : 'fas fa-microphone';
}

    /* --- Renderizar lista de usuarios en el panel de voz --- */
    function renderVoiceUsers(){
        if(!voiceActive){voiceUsers.innerHTML='<div class="voice-empty">Conectando...</div>';return;}
        let html=`<div class="voice-user-item me"><span class="voice-user-dot"></span>${escapeHTML(username)}${isMuted?' <i class="fas fa-microphone-slash" style="font-size:9px;opacity:.5"></i>':''}<span style="margin-left:auto;font-size:10px;opacity:.4">(tú)</span></div>`;
        const peers=Object.entries(voicePeers);
        if(!peers.length){html+='<div class="voice-empty">Esperando a otros...</div>';}
        else{
            peers.forEach(([,p])=>{
                const s=p.pc.connectionState;
                const icon=s==='connected'?'':s==='connecting'||s==='new'
                    ?' <i class="fas fa-spinner" style="font-size:9px;opacity:.5;margin-left:auto;animation:spin 1s linear infinite"></i>'
                    :' <i class="fas fa-circle-xmark" style="font-size:9px;color:var(--error);margin-left:auto"></i>';
                html+=`<div class="voice-user-item"><span class="voice-user-dot" style="${s!=='connected'?'opacity:.3':''}"></span>${escapeHTML(p.name||'?')}${icon}</div>`;
            });
        }
        voiceUsers.innerHTML=html;
    }

    voiceToggleBtn.onclick=()=>voiceActive?leaveVoice():joinVoice();
    voiceLeaveBtn.onclick=leaveVoice;
    voiceMuteBtn.onclick=toggleMute;
    setInterval(()=>{if(voiceActive)renderVoiceUsers();},2000);

</script><style>/* ===== BOTÓN VOZ GIGANTE ===== */

    border:4px solid rgba(255,255,255,.25);

}

    background:linear-gradient(135deg,#34c759,#2da845);
    animation:voicePulse 2s ease-in-out infinite;
}

}

    0%,100%{box-shadow:0 8px 32px rgba(52,199,89,.4)}
    50%{box-shadow:0 8px 48px rgba(52,199,89,.7),0 0 80px rgba(52,199,89,.25)}
}

/* ===== BARRA DE ESTADO DE VOZ ===== */
#voiceStatusBar{
    display:none;
    background:linear-gradient(90deg,#34c759,#2da845);
    color:#fff;
    text-align:center;
    padding:16px;

    z-index:550;

    from{opacity:0;transform:translateY(-10px)}
