<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>BasketHax - Baloncesto 2D Multijugador</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,600;14..32,700;14..32,800&family=Orbitron:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>
    <!-- Menú principal -->
    <div id="menuContainer" class="menu-container">
        <div class="menu-card">
            <h1>🏀 BASKETHAX 🏀</h1>
            <p class="subtitle">Multijugador · Física Haxball · Baloncesto</p>
            <div class="input-group">
                <input type="text" id="playerNameInput" placeholder="Tu nombre" maxlength="20">
            </div>
            <div class="room-actions">
                <button id="createRoomBtn" class="btn primary">➕ Crear Sala</button>
                <button id="refreshRoomsBtn" class="btn secondary">🔄 Actualizar</button>
            </div>
            <div class="rooms-list-container">
                <h3>🏟️ Salas activas</h3>
                <div id="roomsList" class="rooms-list">Cargando...</div>
            </div>
        </div>
        <!-- Modal crear sala -->
        <div id="createRoomModal" class="modal hidden">
            <div class="modal-content">
                <h3>Nueva sala</h3>
                <input type="text" id="roomNameInput" placeholder="Nombre de la sala">
                <select id="roomModeSelect">
                    <option value="1v1">1 vs 1 (2 jugadores)</option>
                    <option value="2v2">2 vs 2 (4 jugadores)</option>
                    <option value="3v3">3 vs 3 (6 jugadores)</option>
                </select>
                <label>Tu equipo:</label>
                <select id="createTeamSelect">
                    <option value="blue">🔵 Azul</option>
                    <option value="red">🔴 Rojo</option>
                </select>
                <div class="modal-buttons">
                    <button id="confirmCreateBtn" class="btn success">Crear</button>
                    <button id="cancelCreateBtn" class="btn danger">Cancelar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Contenedor del juego -->
    <div id="gameContainer" class="game-container hidden">
        <div class="canvas-wrapper">
            <canvas id="gameCanvas" width="1300" height="700" tabindex="0"></canvas>
        </div>
        <div class="game-hud">
            <div class="scoreboard">
                <div class="team blue-team"><span>🔵 AZULES</span><span id="blueScore" class="score">0</span></div>
                <div class="timer-display"><span id="gameTimer">00:00</span></div>
                <div class="team red-team"><span>🔴 ROJOS</span><span id="redScore" class="score">0</span></div>
            </div>
            <div class="player-stats">
                <div class="sprint-bar-container">
                    <div class="sprint-label">⚡ SPRINT</div>
                    <div id="sprintFill" class="sprint-fill"></div>
                </div>
                <div class="shot-clock-container">
                    <div class="shot-label">🏀 RELOJ DE TIRO</div>
                    <div id="shotClockDisplay" class="shot-clock-value">0.0s</div>
                </div>
                <div class="power-bar-container" id="powerBarContainer" style="display: none;">
                    <div class="power-label">💪 POTENCIA</div>
                    <div id="powerFill" class="power-fill"></div>
                </div>
            </div>
            <div class="controls-hint">WASD mover | SHIFT Sprint | E Robar | Mantén ESPACIO para cargar potencia</div>
        </div>
    </div>

    <script type="module">
        import { initGame } from './game.js';
        window.addEventListener('DOMContentLoaded', initGame);
    </script>
</body>
</html>
